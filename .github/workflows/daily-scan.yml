name: daily-scan
on:
  schedule: [{ cron: '0 22 * * *' }]   # 05:00 sáng giờ VN
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/daily_scan.js
        env:
          YT_API_KEYS: ${{ secrets.YT_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.name "scan-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/top_ngach.json && git commit -m "daily scan $(date -u +%F)" && git push || true

      {selectedWikiArticle && (
        <WikiReaderModal
          article={selectedWikiArticle}
          onClose={() => setSelectedWikiArticle(null)}
          onSelectArticle={setSelectedWikiArticle}
          isRead={readWikiArticles && !!readWikiArticles[selectedWikiArticle.id]}
          onToggleRead={toggleWikiRead}
          allArticles={(typeof window !== 'undefined' && window.WIKI_ARTICLES) || []}
        />
      )}

      {/* Demand Validation Engine Modal */}
      {showDemandValidationModal && (
        <DemandValidationModal
          onClose={() => setShowDemandValidationModal(false)}
          currentVideos={allKnownVideos}
          onUseKeyword={(kwd) => { setKw(kwd); setTab('search'); setShowDemandValidationModal(false); load('new'); }}
          onAddToIdeas={addIdeaToBoard}
        />
      )}

      {/* AI Title Pattern Detector Modal */}
      {showTitlePatternModal && (
        <TitlePatternModal
          onClose={() => setShowTitlePatternModal(false)}
          currentVideos={allKnownVideos}
          onAddIdea={addIdeaToBoard}
        />
      )}

      {/* Video Idea Planner & Pipeline Modal */}
      {showIdeaPlannerModal && (
        <VideoIdeaPlannerModal
          onClose={() => setShowIdeaPlannerModal(false)}
          onAddIdeaFromOutside={addIdeaToBoard}
        />
      )}

      {/* Floating Speed Dial: Bộ 3 Công Cụ Nghiên Cứu Ngách (Gọn gàng ở góc màn hình, không chiếm hotbar) */}
      <div className="fixed bottom-6 right-6 z-40 flex flex-col items-end gap-2 select-none">
        {showFloatingTools && (
          <div className="bg-brand-surface/95 backdrop-blur-md border border-brand-border rounded-2xl p-2.5 shadow-2xl flex flex-col gap-1.5 animate-in fade-in slide-in-from-bottom-2 duration-150 min-w-[210px]">
            <div className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider px-2 py-1 border-b border-brand-border/60 flex items-center justify-between">
              <span>Công Cụ Nghiên Cứu</span>
              <span className="text-[10px] text-amber-400 font-semibold">3 Tools</span>
            </div>
            <button
              type="button"
              onClick={() => { setShowDemandValidationModal(true); setShowFloatingTools(false); }}
              className="px-3 py-2 rounded-xl text-xs font-semibold bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 transition flex items-center gap-2 text-left">
              <span>🧪</span>
              <span>Kiểm Chứng Nhu Cầu</span>
            </button>
            <button
              type="button"
              onClick={() => { setShowTitlePatternModal(true); setShowFloatingTools(false); }}
              className="px-3 py-2 rounded-xl text-xs font-semibold bg-purple-500/10 hover:bg-purple-500/20 text-purple-300 border border-purple-500/30 transition flex items-center gap-2 text-left">
              <span>🎯</span>
              <span>Khuôn Tiêu Đề</span>
            </button>
            <button
              type="button"
              onClick={() => { setShowIdeaPlannerModal(true); setShowFloatingTools(false); }}
              className="px-3 py-2 rounded-xl text-xs font-semibold bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 transition flex items-center gap-2 text-left">
              <span>📋</span>
              <span>Kế Hoạch Video</span>
            </button>
          </div>
        )}

        <button
          type="button"
          onClick={() => setShowFloatingTools(!showFloatingTools)}
          className={`h-10 px-3 rounded-full shadow-2xl flex items-center gap-1.5 transition border ${
            showFloatingTools 
              ? 'bg-zinc-200 text-zinc-950 border-white shadow-white/10' 
              : 'bg-brand-card hover:bg-zinc-800 text-zinc-200 hover:text-white border-brand-border hover:border-zinc-500 shadow-black/80'
          }`}
          title="Mở menu 3 công cụ: Kiểm Chứng Nhu Cầu, Khuôn Tiêu Đề, Kế Hoạch Video">
          <span className="text-sm">🛠️</span>
          <span className="text-xs font-bold">{showFloatingTools ? 'Đóng' : 'Công cụ'}</span>
        </button>
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, errorInfo) {
    console.error("ErrorBoundary caught:", error, errorInfo);
  }
  render() {
    if (this.state.hasError) {
      if (this.props.fallback !== undefined) {
        return this.props.fallback;
      }
      return (
        <div className="min-h-screen bg-[#0b0c10] text-zinc-200 flex flex-col items-center justify-center p-6 text-center">
          <div className="max-w-md bg-[#181b26] border border-[#232738] rounded-2xl p-6 shadow-2xl space-y-4">
            <h2 className="text-base font-bold text-white">Đã xảy ra sự cố hiển thị</h2>
            <p className="text-xs text-zinc-400">
              Trang web đã tự động phục hồi an toàn. Bạn có thể bấm nút bên dưới để tiếp tục trải nghiệm.
            </p>
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={() => { this.setState({ hasError: false }); window.location.reload(); }}
                className="px-4 py-2 rounded-lg text-xs font-semibold bg-zinc-100 hover:bg-white text-zinc-950 transition">
                Tải lại trang web
              </button>
              <button
                onClick={() => { this.setState({ hasError: false }); window.location.href = window.location.pathname; }}
                className="px-4 py-2 rounded-lg text-xs font-medium bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700 transition">
                Về trang chủ
              </button>
            </div>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>
);
</script>

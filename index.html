};

// Trend Scoring Algorithm (Calibrated for freshness & viral speed)
function score(v) {
  const hours = Math.max((Date.now() - new Date(v.published).getTime()) / 36e5, 0.5);
  const vph = v.views / hours;
  const speed = 40 * clamp(Math.log10(vph + 1) / 5);
  const fresh = 20 * (1 - clamp(Math.log10(hours + 1) / Math.log10(24 * 90 + 1)));
  const inter = (v.likes == null ? 0 : v.likes) + (v.comments == null ? 0 : v.comments);
  const rate = v.views > 0 ? inter / v.views : 0;
  const eng = 20 * clamp(Math.log10(1 + rate * 100) / Math.log10(11));
  const ratio = v.subs == null ? null : v.views / Math.max(v.subs, 1000);
  const rel = ratio == null ? 0 : 20 * clamp(Math.log10(ratio + 1) / Math.log10(11));
  const total = Math.round((speed + fresh + eng + rel) * 10) / 10;
  return { hours, vph, speed, fresh, eng, rel, rate, ratio, total, engPercent: (rate * 100).toFixed(2) };
}

// YouTube Data API Client
async function yt(path, params, key) {
  const u = new URL('https://www.googleapis.com/youtube/v3/' + path);
  Object.entries(params).forEach(([k, v]) => {
    if (v !== undefined && v !== null && v !== '') u.searchParams.set(k, v);
  });
  u.searchParams.set('key', key);
  let r;
  try {
    r = await fetch(u.toString());
  } catch (e) {
    throw { code: 'NETWORK', msg: String(e) };
  }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const e0 = j.error && j.error.errors && j.error.errors[0];
    throw { code: (e0 && e0.reason) || ('HTTP' + r.status), msg: (j.error && j.error.message) || '' };
  }
  return j;
}

function errInfo(e) {
  const c = e.code;
  if (c === 'MISSING') return { t: 'Chưa nhập YouTube API Key', s: ['Bấm nút "Cấu hình API Key" ở góc trên bên phải.', 'Dán API Key YouTube Data API v3 của bạn rồi bấm "Lưu".', 'Key chỉ lưu trong trình duyệt của bạn (localStorage) và hoàn toàn an toàn.'] };
  if (c === 'quotaExceeded' || c === 'dailyLimitExceeded' || c === 'rateLimitExceeded') return { t: 'Đã dùng hết Quota YouTube API trong ngày', s: ['Mỗi tài khoản Google mặc định được 10.000 đơn vị quota/ngày.', 'Mỗi lần tìm từ khóa tốn 100 đơn vị, trong khi xem bảng xếp hạng thịnh hành chỉ tốn 1 đơn vị.', 'Mẹo: Bạn có thể tạo thêm 1 project khác trên Google Cloud để lấy key phụ hoặc đợi quota reset (14h-15h VN).'] };
  if (c === 'keyInvalid' || c === 'badRequest' || c === 'HTTP400') return { t: 'API Key không hợp lệ', s: ['Kiểm tra bạn đã copy đúng và đủ mã key (không thừa ký tự trắng).', 'Vào Google Cloud Console > Credentials để kiểm tra key.', 'Đảm bảo API "YouTube Data API v3" đã được bấm ENABLE trong project.'] };
  if (c === 'ipRefererBlocked' || c === 'forbidden' || c === 'HTTP403' || c === 'accessNotConfigured') return { t: 'API Key bị từ chối truy cập (403)', s: ['Nếu bạn bật giới hạn Website Referrer, hãy tạm thời bỏ giới hạn hoặc thêm URL hiện tại.', 'Đảm bảo "YouTube Data API v3" đã được Bật trong Google Cloud Console.'] };
  if (c === 'NETWORK') return { t: 'Lỗi mạng hoặc bị chặn', s: ['Kiểm tra kết nối mạng Internet của bạn.', 'Tắt các tiện ích chặn quảng cáo nếu có thể gây chặn kết nối Google API.'] };
  return { t: 'Lỗi kết nối: ' + c, s: [e.msg || 'Vui lòng thử lại sau giây lát.'] };
}

// Download Modal Component with Resolution & Format Options
function DownloadModal({ video, onClose, onCopy }) {
  const [downloadingThumb, setDownloadingThumb] = useState(false);
  const [copied, setCopied] = useState(false);

  if (!video) return null;

  const ytUrl = `https://www.youtube.com/watch?v=${video.id}`;

  const downloadThumbnail = async (quality = 'maxres') => {
    setDownloadingThumb(true);
    const thumbUrl = quality === 'maxres' 
      ? `https://i.ytimg.com/vi/${video.id}/maxresdefault.jpg`
      : `https://i.ytimg.com/vi/${video.id}/hqdefault.jpg`;
    
    try {
      const res = await fetch(thumbUrl);
      if (!res.ok) throw new Error();
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${video.title.replace(/[/\\?%*:|"<>]/g, '').slice(0, 50)}_thumbnail.jpg`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (e) {
      window.open(thumbUrl, '_blank');
    } finally {
      setDownloadingThumb(false);
    }
  };

  const openFastDownloader = (engine) => {
    let url = '';
    if (engine === '10downloader') {
      url = `https://10downloader.com/download?v=${video.id}`;
    } else if (engine === 'y2mate') {
      url = `https://www.y2mate.com/youtube/${video.id}`;

      url = `https://www.ssyoutube.com/watch?v=${video.id}`;
    }
    window.open(url, '_blank');

// Main Application Component
function App() {
  const [key, setKey] = useState(() => st.get('yt_key') || '');
  const [keyDraft, setKeyDraft] = useState('');
  const [showKeyBox, setShowKeyBox] = useState(false);
  const [showKey, setShowKey] = useState(false);
  
  const [tab, setTab] = useState('search'); // 'search' | 'watch'
  const [kw, setKw] = useState('');
  const [activePreset, setActivePreset] = useState('realtime');
  
  // Filter States (Default period: 24h for fresh real-time videos)
  const [f, setF] = useState(DEF);
  const [applied, setApplied] = useState(DEF);
  const [sort, setSort] = useState('vph');
  const [mode, setMode] = useState('grid');
  
  // Data States
  const [items, setItems] = useState([]);
  const [token, setToken] = useState('');
  const [loading, setLoading] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  
  // Modals
  const [detail, setDetail] = useState(null);
  const [downloadVideo, setDownloadVideo] = useState(null);
  const [toast, setToast] = useState(null);
  
  const [watch, setWatch] = useState(() => {
    try { return JSON.parse(st.get('yt_watch') || '{}'); } catch (e) { return {}; }
  });

  const lastQ = useRef(null);
  const storageOk = useMemo(() => st.ok(), []);

  useEffect(() => { st.set('yt_watch', JSON.stringify(watch)); }, [watch]);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2500);
  };

  const copyText = (txt, msg = 'Đã sao chép vào bộ nhớ tạm!') => {
    navigator.clipboard.writeText(txt);
    showToast(msg);
  };

  function saveKey() {
    const k = keyDraft.trim();
    setKey(k);
    st.set('yt_key', k);
    setShowKeyBox(false);
    setError(null);
    showToast('Đã lưu API Key thành công!');
  }

  function removeKey() {
    setKey('');
    setKeyDraft('');
    st.set('yt_key', '');
    showToast('Đã xóa API Key!');
  }

  // Load YouTube Data (High precision with maxResults: 50 & order: 'viewCount')
  async function load(kind, overrideParams) {
    if (!key) {
      setError({ code: 'MISSING' });
      return;
    }
    const more = kind === 'more';
    let p = overrideParams;
    if (!p) {
      if (more || kind === 'refresh') {
        p = lastQ.current;
      }
    }
    if (!p) {
      p = { kw: kw.trim(), cat: f.cat, region: f.region, period: f.period };
    }
    if (kind === 'new') {
      setApplied(p);
    }
    lastQ.current = p;

    setLoading(true);
    setError(null);
    if (!more) setItems([]);

    try {
      const cutoff = p.period > 0 ? Date.now() - p.period * 36e5 : 0;
      let vids = [], next = '';

      if (p.kw) {
        // Keyword Search: ALWAYS use order: 'viewCount' so top-viewed videos within publishedAfter are returned
        const searchParams = {
          part: 'snippet',
          type: 'video',
          q: p.kw,
          maxResults: 50,
          regionCode: p.region,
          order: 'viewCount',
          pageToken: more ? token : ''
        };
        if (p.cat) searchParams.videoCategoryId = p.cat;
        if (cutoff > 0) searchParams.publishedAfter = new Date(cutoff).toISOString();

        const s = await yt('search', searchParams, key);
        next = s.nextPageToken || '';
        const ids = (s.items || []).map(i => i.id && i.id.videoId).filter(Boolean);
        vids = ids.length ? ((await yt('videos', { part: 'snippet,statistics,contentDetails', id: ids.join(',') }, key)).items || []) : [];
      } else {
        // Most Popular Chart: Fetch up to 50 items so filtered cutoff contains plenty of fresh videos
        const vidParams = {
          part: 'snippet,statistics,contentDetails',
          chart: 'mostPopular',
          regionCode: p.region,
          maxResults: 50,
          pageToken: more ? token : ''
        };
        if (p.cat) vidParams.videoCategoryId = p.cat;

        const s = await yt('videos', vidParams, key);
        next = s.nextPageToken || '';
        vids = (s.items || []).filter(i => cutoff === 0 || new Date(i.snippet.publishedAt).getTime() >= cutoff);
      }

      // Fetch Channel Statistics for subscriber ratio
      const cids = [...new Set(vids.map(v => v.snippet.channelId))];
      const subs = {};
      if (cids.length) {
        const c = await yt('channels', { part: 'statistics', id: cids.join(',') }, key);
        (c.items || []).forEach(x => {
          subs[x.id] = x.statistics.hiddenSubscriberCount ? null : Number(x.statistics.subscriberCount);
        });
      }

      const out = vids.map(v => {
        const s = v.statistics || {};
        const bestThumb = getBestThumb(v.snippet.thumbnails);
        const durSeconds = parseDur(v.contentDetails && v.contentDetails.duration);
        const o = {
          id: v.id,
          title: v.snippet.title,
          channel: v.snippet.channelTitle,
          channelId: v.snippet.channelId,
          thumb: bestThumb,
          published: v.snippet.publishedAt,
          ts: new Date(v.snippet.publishedAt).getTime(),
          views: Number(s.viewCount || 0),
          likes: s.likeCount == null ? null : Number(s.likeCount),
          comments: s.commentCount == null ? null : Number(s.commentCount),
          dur: durSeconds,
          subs: subs[v.snippet.channelId] === undefined ? null : subs[v.snippet.channelId]
        };
        const sc = score(o);
        o.sc = sc;
        o.total = sc.total;
        o.vph = sc.vph;
        o.eng = sc.eng;
        return o;
      });

      setItems(prev => more ? [...prev, ...out.filter(o => !prev.some(x => x.id === o.id))] : out);
      setToken(next);
      setLoaded(true);
    } catch (e) {
      setError(e);
    } finally {
      setLoading(false);
    }
  }

  function applyPreset(preset) {
    setActivePreset(preset.id);
    const updated = {
      ...f,
      cat: preset.cat,
      period: preset.period,
      vtype: preset.vtype || 'all'
    };
    setF(updated);
    setApplied(updated);
    if (preset.sort) setSort(preset.sort);

    load('new', {
      kw: kw.trim(),
      cat: preset.cat,
      region: f.region,
      period: preset.period
    });
  }

  function handleFilterChange(field, val) {
    const updated = { ...f, [field]: val };
    setF(updated);
    setApplied(updated);
    load('new', {
      kw: kw.trim(),
      cat: updated.cat,
      region: updated.region,
      period: updated.period
    });
  }

  function clearFilters() {
    setF(DEF);
    setApplied(DEF);
    setKw('');
    setActivePreset('realtime');
    setSort('vph');
    load('new', { kw: '', cat: DEF.cat, region: DEF.region, period: DEF.period });
  }

  const shown = useMemo(() => {
    const mv = Number(applied.minViews) || 0;
    return items
      .filter(v => v.views >= mv)
      .filter(v => {
        if (applied.vtype === 'all') return true;
        if (applied.vtype === 'short') return v.dur <= 60;
        if (applied.vtype === 'brief') return v.dur > 60 && v.dur <= 300;
        if (applied.vtype === 'medium') return v.dur > 300 && v.dur <= 1200;
        if (applied.vtype === 'long') return v.dur > 1200;
        return true;
      })
      .sort((a, b) => {
        if (sort === 'total') return b.total - a.total;
        if (sort === 'vph') return b.vph - a.vph;
        if (sort === 'views') return b.views - a.views;
        if (sort === 'ts') return b.ts - a.ts;
        if (sort === 'eng') return b.eng - a.eng;
        if (sort === 'dur') return b.dur - a.dur;
        return 0;
      });
  }, [items, applied, sort]);

  const stats = useMemo(() => {
    const n = shown.length;
    return {
      n,
      views: shown.reduce((a, v) => a + v.views, 0),
      avg: n ? shown.reduce((a, v) => a + v.total, 0) / n : 0,
      maxVph: n ? Math.max(...shown.map(v => v.vph)) : 0
    };
  }, [shown]);

  function toggleWatch(v) {
    setWatch(w => {
      const n = { ...w };
      if (n[v.id]) {
        delete n[v.id];
        showToast('Đã xóa khỏi Watchlist');
      } else {
        n[v.id] = { id: v.id, title: v.title, channel: v.channel, thumb: v.thumb, published: v.published, snaps: [{ t: Date.now(), v: v.views }] };
        showToast('Đã thêm vào Watchlist theo dõi');
      }
      return n;
    });
  }

  async function updateSnaps() {
    const ids = Object.keys(watch);
    if (!ids.length) return;
    if (!key) { setError({ code: 'MISSING' }); return; }
    setBusy(true);
    setError(null);
    try {
      const cur = {};
      for (let i = 0; i < ids.length; i += 50) {
        const r = await yt('videos', { part: 'statistics', id: ids.slice(i, i + 50).join(',') }, key);
        (r.items || []).forEach(x => { cur[x.id] = Number(x.statistics.viewCount || 0); });
      }
      const t = Date.now();
      setWatch(w => {
        const n = { ...w };
        Object.keys(cur).forEach(id => {
          if (n[id]) n[id] = { ...n[id], snaps: [...n[id].snaps, { t, v: cur[id] }] };
        });
        return n;
      });
      showToast('Đã cập nhật snapshot mới nhất!');
    } catch (e) {
      setError(e);
    } finally {
      setBusy(false);
    }
  }

  function exportCsv() {
    const esc = x => { const s = String(x == null ? '' : x); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const head = ['Tiêu đề', 'Kênh', 'Link', 'Ngày đăng', 'Lượt xem', 'Lượt thích', 'Bình luận', 'Subscribers', 'Views/Giờ', 'Trend Score'];
    const rows = shown.map(v => [v.title, v.channel, 'https://www.youtube.com/watch?v=' + v.id, fmtD(v.published), v.views, v.likes == null ? '' : v.likes, v.comments == null ? '' : v.comments, v.subs == null ? '' : v.subs, Math.round(v.vph), v.total]);
    const csv = '\uFEFF' + [head, ...rows].map(r => r.map(esc).join(',')).join('\r\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = 'youtrend-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('Đã xuất file Excel (CSV) thành công!');
  }

  const ei = error ? errInfo(error) : null;
  const watchList = Object.values(watch);

  return (
    <div className="min-h-screen flex flex-col bg-brand-dark text-slate-100">
      {/* Toast Notification */}
      {toast && (
        <div className="fixed bottom-6 right-6 z-50 bg-emerald-600 text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs sm:text-sm font-semibold flex items-center gap-2 animate-in fade-in slide-in-from-bottom-3 duration-200">
          <span>✓</span> {toast}
        </div>
      )}

      {/* Top Header */}
      <header className="border-b border-brand-border sticky top-0 glass-header z-30">
        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
          <div className="flex items-center gap-2.5">
            <div className="w-3 h-3 rounded-full bg-red-600 shadow-sm shadow-red-500"></div>
            <div>
              <span className="font-extrabold text-base sm:text-lg tracking-tight text-white flex items-center gap-2">
                YouTrend <span className="text-[10px] uppercase font-bold px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-300 border border-zinc-700">Analytics</span>
              </span>
            </div>
          </div>

          {/* Navigation Tabs */}
          <nav className="flex items-center gap-1 bg-brand-surface p-1 rounded-xl border border-brand-border">
            <button onClick={() => setTab('search')} className={tab === 'search' ? bActive : 'px-3 py-1.5 text-xs font-medium text-zinc-400 hover:text-white rounded-lg transition'}>
              Tìm xu hướng
            </button>
            <button onClick={() => setTab('watch')} className={tab === 'watch' ? bActive : 'px-3 py-1.5 text-xs font-medium text-zinc-400 hover:text-white rounded-lg transition'}>
              Watchlist ({watchList.length})
            </button>
          </nav>

          {/* API Key Status Button */}
          <button 
            onClick={() => { setKeyDraft(key); setShowKeyBox(true); }} 
            className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center border transition ${key ? 'bg-brand-surface text-emerald-400 border-emerald-500/30 hover:bg-emerald-500/10' : 'bg-red-600/20 text-red-300 border-red-500/40'}`}>
            {key ? 'API Key: Đã lưu' : 'Cấu hình API Key'}
          </button>
        </div>
      </header>

      {/* Main Body */}
      <main className="max-w-7xl mx-auto px-4 py-5 space-y-4 flex-1 w-full">
        {/* Missing Key Banner */}
        {!key && (
          <div className="border border-red-500/30 bg-red-950/40 rounded-2xl p-4 text-sm space-y-2 shadow-lg">
            <div className="font-bold text-red-300 text-sm">
              Bạn cần nhập YouTube API Key để tải dữ liệu xu hướng thực tế
            </div>
            <p className="text-zinc-300 text-xs">
              Ứng dụng lấy dữ liệu trực tiếp từ YouTube Data API v3 chính thống. Key được lưu an toàn trực tiếp trên trình duyệt của bạn (localStorage).
            </p>
            <div className="flex flex-wrap gap-2 pt-1">
              <button onClick={() => { setKeyDraft(key); setShowKeyBox(true); }} className={bPrimary}>
                Nhập API Key
              </button>
              <a href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank" rel="noreferrer" className={bSecondary}>
                Lấy Key miễn phí trên Google Cloud
              </a>
            </div>
          </div>
        )}

        {/* Error Notification */}
        {ei && (
          <div className="border border-red-500/40 bg-red-950/50 rounded-2xl p-4 text-sm shadow-lg">
            <div className="font-bold text-red-300 mb-1">{ei.t}</div>
            <ul className="list-disc ml-5 space-y-1 text-zinc-300 text-xs">{ei.s.map((x, i) => <li key={i}>{x}</li>)}</ul>
            <button onClick={() => setError(null)} className={bSecondary + ' mt-3 py-1'}>Đóng thông báo</button>
          </div>
        )}

        {/* SEARCH TAB CONTENT */}
        {tab === 'search' && (<>
          {/* Quick Preset Buttons Bar */}
          <section className="flex flex-wrap items-center gap-1.5">
            <span className="text-xs font-semibold text-zinc-400 mr-1 hidden sm:inline">Chế độ nhanh:</span>
            {PRESETS.map(p => {
              const isActive = activePreset === p.id;
              return (
                <button
                  key={p.id}
                  onClick={() => applyPreset(p)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition border ${
                    isActive 
                      ? 'bg-red-600 text-white border-red-500 shadow-sm' 
                      : 'bg-brand-surface hover:bg-brand-card text-zinc-300 border-brand-border'
                  }`}>
                  {p.label}
                </button>
              );
            })}
          </section>

          {/* Compact Streamlined Search & Filter Section */}
          <section className="bg-brand-surface border border-brand-border rounded-xl p-3 sm:p-4 space-y-3 shadow-md">
            {/* Unified Single Row: Input + Thời gian + Lĩnh vực + Quốc gia + Quét */}
            <div className="flex flex-col md:flex-row gap-2">
              <div className="relative flex-1">
                <input
                  className={inp + ' py-2 text-xs sm:text-sm'}
                  placeholder="Nhập từ khóa tìm kiếm (để trống để xem video thịnh hành)..."
                  value={kw}
                  onChange={e => setKw(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter') load('new'); }}
                />
              </div>

              <div className="flex flex-wrap sm:flex-nowrap gap-1.5">
                {/* Thời gian đăng - PROMINENT DIRECT SELECTOR */}
                <select
                  className="bg-brand-card border border-brand-border rounded-lg px-2.5 py-1.5 text-xs text-zinc-200 focus:outline-none focus:border-red-500 max-w-[155px]"
                  value={f.period}
                  onChange={e => handleFilterChange('period', Number(e.target.value))}
                  title="Khoảng thời gian video được đăng tải">
                  {PERIODS.map(c => <option key={c[0]} value={c[0]}>{c[1]}</option>)}
                </select>

                {/* Lĩnh vực */}
                <select
                  className="bg-brand-card border border-brand-border rounded-lg px-2.5 py-1.5 text-xs text-zinc-200 focus:outline-none focus:border-red-500 max-w-[135px] truncate"
                  value={f.cat}
                  onChange={e => handleFilterChange('cat', e.target.value)}
                  title="Danh mục video">
                  {CATS.map(c => <option key={c[0]} value={c[0]}>{c[1]}</option>)}
                </select>

                {/* Quốc gia */}
                <select
                  className="bg-brand-card border border-brand-border rounded-lg px-2.5 py-1.5 text-xs text-zinc-200 focus:outline-none focus:border-red-500 max-w-[115px]"
                  value={f.region}
                  onChange={e => handleFilterChange('region', e.target.value)}
                  title="Khu vực quốc gia">
                  {REGIONS.map(c => <option key={c[0]} value={c[0]}>{c[1]}</option>)}
                </select>

                {/* Nút Quét */}
                <button 
                  onClick={() => load('new')} 
                  disabled={loading} 
                  className={bPrimary + ' py-1.5 px-4 text-xs whitespace-nowrap disabled:opacity-50'}>
                  {loading ? 'Đang quét...' : 'Quét'}
                </button>

                {/* Nút Đặt lại */}
                <button
                  onClick={clearFilters}
                  className="px-2.5 py-1.5 rounded-lg text-xs font-medium text-zinc-400 hover:text-white bg-brand-card hover:bg-brand-hover border border-brand-border transition whitespace-nowrap"
                  title="Đặt lại bộ lọc về mặc định (24h)">
                  Đặt lại
                </button>
              </div>
            </div>

            {/* Sub-row: Quick Keyword Tags & Video Type Filter */}
            <div className="flex flex-wrap items-center justify-between gap-2 pt-1 border-t border-brand-border/60 text-xs">
              <div className="flex flex-wrap items-center gap-1.5">
                <span className="text-zinc-500 font-medium text-[11px]">Gợi ý từ khóa:</span>
                {QUICK_TAGS.map(tag => (
                  <button
                    key={tag}
                    onClick={() => { setKw(tag); load('new', { kw: tag, cat: f.cat, region: f.region, period: f.period }); }}
                    className="px-2 py-0.5 rounded-md bg-brand-card hover:bg-brand-hover text-zinc-300 hover:text-white border border-brand-border transition text-[11px]">
                    {tag}
                  </button>
                ))}
                {kw && (
                  <button onClick={() => { setKw(''); load('new', { kw: '', cat: f.cat, region: f.region, period: f.period }); }} className="text-zinc-500 hover:text-red-400 ml-1 text-xs">
                    Xóa
                  </button>
                )}
              </div>

              {/* Quick Duration filter pills */}
              <div className="flex items-center gap-1 text-[11px]">
                <span className="text-zinc-500">Độ dài:</span>
                <select
                  className="bg-brand-card border border-brand-border rounded px-2 py-0.5 text-[11px] text-zinc-300 focus:outline-none"
                  value={f.vtype}
                  onChange={e => { const upd = { ...f, vtype: e.target.value }; setF(upd); setApplied(upd); }}>
                  {TYPES.map(t => <option key={t[0]} value={t[0]}>{t[1]}</option>)}
                </select>
              </div>
            </div>
          </section>

          {/* Quick Statistics Overview */}
          <section className="grid grid-cols-2 lg:grid-cols-4 gap-2.5">
            {[
              ['Tổng video phân tích', fmt(stats.n)],
              ['Tổng lượt xem', fmt(stats.views)],
              ['Điểm Trend TB', stats.avg.toFixed(1) + ' / 100'],
              ['Tốc độ VPH đỉnh', fmt(stats.maxVph) + ' view/h']
            ].map(c => (
              <div key={c[0]} className="bg-brand-surface border border-brand-border rounded-xl p-3 shadow-sm hover:border-zinc-700 transition">
                <div className="text-[11px] text-zinc-400 font-medium">{c[0]}</div>
                <div className="text-lg sm:text-xl font-black mt-0.5 text-white tracking-tight">{c[1]}</div>
              </div>
            ))}
          </section>

          {/* Sorting & Views Toolbar */}
          <section className="flex flex-wrap items-center justify-between gap-2 p-2.5 bg-brand-surface border border-brand-border rounded-xl">
            <div className="flex flex-wrap items-center gap-1.5">
              <span className="text-xs font-semibold text-zinc-400">Sắp xếp:</span>
              <div className="flex flex-wrap gap-1">
                {SORTS.map(s => (
                  <button
                    key={s[0]}
                    onClick={() => setSort(s[0])}
                    className={`px-2.5 py-1 rounded-lg text-xs font-semibold transition ${sort === s[0] ? 'bg-red-600 text-white' : 'bg-brand-card hover:bg-brand-hover text-zinc-300 border border-brand-border'}`}>
                    {s[1]}
                  </button>
                ))}
              </div>
            </div>

            <div className="flex items-center gap-1.5 ml-auto">
              <div className="flex bg-brand-card border border-brand-border rounded-lg p-0.5">
                <button onClick={() => setMode('grid')} className={`px-2 py-0.5 rounded-md text-xs font-medium transition ${mode === 'grid' ? 'bg-brand-border text-white' : 'text-zinc-400'}`}>
                  Thẻ
                </button>
                <button onClick={() => setMode('table')} className={`px-2 py-0.5 rounded-md text-xs font-medium transition ${mode === 'table' ? 'bg-brand-border text-white' : 'text-zinc-400'}`}>
                  Bảng
                </button>
              </div>
              <button onClick={exportCsv} disabled={!shown.length} className={bSecondary + ' py-1 px-2.5 text-xs disabled:opacity-40'}>
                Xuất Excel
              </button>
              <button onClick={() => load('refresh')} disabled={loading} className={bSecondary + ' py-1 px-2.5 text-xs disabled:opacity-40'}>
                Làm mới
              </button>
            </div>
          </section>

          {/* Loading Skeleton */}
          {loading && !items.length && (
            <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
              {Array.from({ length: 8 }).map((_, i) => (
                <div key={i} className="bg-brand-surface border border-brand-border rounded-xl overflow-hidden animate-pulse">
                  <div className="aspect-video bg-zinc-800"></div>
                  <div className="p-4 space-y-2">
                    <div className="h-4 bg-zinc-800 rounded w-5/6"></div>
                    <div className="h-3 bg-zinc-800 rounded w-1/2"></div>
                    <div className="h-3 bg-zinc-800 rounded w-2/3"></div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Empty State */}
          {!loading && !shown.length && (
            <div className="text-center border border-dashed border-brand-border rounded-2xl p-10 bg-brand-surface/40">
              <h3 className="font-bold text-base text-white">{loaded ? 'Không có video nào thỏa mãn bộ lọc' : 'Sẵn sàng quét xu hướng'}</h3>
              <p className="text-xs sm:text-sm text-zinc-400 max-w-md mx-auto mt-1">
                {loaded ? 'Hãy thử nới rộng thời gian đăng (ví dụ 48 giờ hoặc 7 ngày) để xem thêm.' : 'Chọn một chế độ xu hướng nhanh ở trên để bắt đầu.'}
              </p>
              {!loaded && (
                <button onClick={() => load('new')} className={bPrimary + ' mx-auto mt-3'}>
                  Quét ngay video thịnh hành 24h
                </button>
              )}
            </div>
          )}

          {/* GRID VIEW */}
          {shown.length > 0 && mode === 'grid' && (
            <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
              {shown.map(v => {
                const ytUrl = 'https://www.youtube.com/watch?v=' + v.id;
                return (
                  <article key={v.id} className="bg-brand-surface border border-brand-border hover:border-zinc-700 rounded-xl overflow-hidden flex flex-col group transition duration-150 hover:shadow-xl hover:shadow-black/40">
                    {/* Thumbnail Container (Click opens directly on YouTube) */}
                    <a 
                      href={ytUrl} 
                      target="_blank" 
                      rel="noopener noreferrer" 
                      className="relative aspect-video bg-zinc-900 overflow-hidden block"
                      title="Mở xem trên YouTube">
                      <img src={v.thumb} alt="" className="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy" />
                      
                      {/* Trend Score Badge */}
                      <div className={`absolute top-2.5 right-2.5 text-xs font-black px-2 py-0.5 rounded-lg backdrop-blur-md shadow-lg ${scoreCls(v.total)}`}>
                        {v.total}
                      </div>

                      {/* Duration Badge */}
                      <div className="absolute bottom-2.5 right-2.5 text-[11px] font-semibold px-2 py-0.5 rounded-md bg-black/85 text-white backdrop-blur-sm">
                        {v.dur <= 60 && <span className="text-red-400 font-bold mr-1">Shorts</span>}
                        {fmtDur(v.dur)}
                      </div>

                      {/* Hover Overlay */}
                      <div className="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 flex items-center justify-center transition">
                        <div className="px-3 py-1.5 rounded-lg bg-red-600/95 text-white font-semibold text-xs shadow-lg">
                          Xem trên YouTube
                        </div>
                      </div>
                    </a>

                    {/* Card Content */}
                    <div className="p-3.5 flex flex-col gap-2 flex-1">
                      <a 
                        href={ytUrl} 
                        target="_blank" 
                        rel="noopener noreferrer" 
                        className="text-xs sm:text-sm font-bold text-white line-clamp-2 leading-snug group-hover:text-red-400 transition" 
                        title={v.title}>
                        {v.title}
                      </a>
                      <div className="text-xs text-zinc-400 flex items-center justify-between">
                        <span className="truncate max-w-[160px]">{v.channel}</span>
                        <span className="text-[11px] text-zinc-500">{v.subs ? fmt(v.subs) + ' subs' : ''}</span>
                      </div>

                      {/* Metric Pills */}
                      <div className="grid grid-cols-2 gap-1.5 text-[11px] bg-brand-card p-2 rounded-lg border border-brand-border">
                        <div className="text-zinc-300">
                          <span className="text-zinc-500">Lượt xem:</span> <b className="text-white">{fmt(v.views)}</b>
                        </div>
                        <div className="text-emerald-400 font-semibold">
                          <span className="text-zinc-500 font-normal">Tốc độ:</span> +{fmt(v.vph)}/h
                        </div>
                        <div className="text-zinc-400 col-span-2 flex justify-between border-t border-brand-border/60 pt-1 mt-0.5">
                          <span>{fmtD(v.published).split(' ')[0]}</span>
                          <span className="text-amber-400">{v.sc.engPercent}% T.Tác</span>
                        </div>
                      </div>

                      {/* Action Buttons */}
                      <div className="mt-auto pt-1">
                        <Actions 
                          v={v} 
                          saved={!!watch[v.id]} 
                          onDetail={setDetail} 
                          onDownload={setDownloadVideo} 
                          onSave={toggleWatch}
                          onCopy={copyText}
                        />
                      </div>
                    </div>
                  </article>
                );
              })}
            </div>
          )}

          {/* TABLE VIEW */}
          {shown.length > 0 && mode === 'table' && (
            <div className="overflow-x-auto border border-brand-border rounded-xl bg-brand-surface shadow-lg">
              <table className="w-full text-xs sm:text-sm">
                <thead className="bg-brand-card border-b border-brand-border text-zinc-400">
                  <tr>
                    {['Video & Tiêu đề', 'Kênh', 'Lượt xem', 'Tốc độ Views/h', 'Trend Score', 'Ngày đăng', 'Hành động'].map(h => (
                      <th key={h} className="text-left p-3 font-semibold whitespace-nowrap">{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody className="divide-y divide-brand-border">
                  {shown.map(v => {
                    const ytUrl = 'https://www.youtube.com/watch?v=' + v.id;
                    return (
                      <tr key={v.id} className="hover:bg-brand-card/40 transition">
                        <td className="p-3 min-w-[280px]">
                          <div className="flex gap-3 items-center">
                            <a href={ytUrl} target="_blank" rel="noopener noreferrer" className="relative w-24 aspect-video rounded-lg overflow-hidden bg-zinc-900 flex-shrink-0 block group">
                              <img src={v.thumb} alt="" className="w-full h-full object-cover group-hover:scale-105 transition" />
                              <span className="absolute bottom-1 right-1 text-[10px] px-1 py-0.5 rounded bg-black/80 font-bold">{fmtDur(v.dur)}</span>
                            </a>
                            <a href={ytUrl} target="_blank" rel="noopener noreferrer" className="font-semibold text-white line-clamp-2 leading-snug hover:text-red-400 transition">
                              {v.title}
                            </a>
                          </div>
                        </td>
                        <td className="p-3 text-zinc-300 whitespace-nowrap">{v.channel}</td>
                        <td className="p-3 text-white font-semibold whitespace-nowrap">{fmt(v.views)}</td>
                        <td className="p-3 text-emerald-400 font-semibold whitespace-nowrap">+{fmt(v.vph)}/h</td>
                        <td className="p-3 whitespace-nowrap">
                          <span className={`px-2.5 py-1 rounded-lg font-black text-xs ${scoreCls(v.total)}`}>{v.total}</span>
                        </td>
                        <td className="p-3 text-zinc-400 whitespace-nowrap">{fmtD(v.published)}</td>
                        <td className="p-3 min-w-[220px]">
                          <Actions 
                            v={v} 
                            saved={!!watch[v.id]} 
                            onDetail={setDetail} 
                            onDownload={setDownloadVideo} 
                            onSave={toggleWatch}
                            onCopy={copyText}
                          />
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}

          {/* Load More Button */}
          {token && !loading && (
            <div className="text-center pt-4">
              <button onClick={() => load('more')} className={bPrimary + ' px-8 py-2 text-sm'}>
                Tải thêm 50 video tiếp theo
              </button>
            </div>
          )}
        </>)}

        {/* WATCHLIST TAB CONTENT */}
        {tab === 'watch' && (
          <section className="space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3 p-4 bg-brand-surface border border-brand-border rounded-xl">
              <div>
                <h2 className="font-bold text-base text-white">Danh sách theo dõi tăng trưởng (Snapshot)</h2>
                <p className="text-xs text-zinc-400">Ghi nhận sự tăng trưởng lượt xem thực tế theo từng thời điểm để phân tích tốc độ tăng view.</p>
              </div>
              <button onClick={updateSnaps} disabled={busy || !watchList.length} className={bPrimary + ' disabled:opacity-40'}>
                {busy ? 'Đang quét snapshot...' : 'Cập nhật lượt xem mới'}
              </button>
            </div>

            {!watchList.length && (
              <div className="text-center border border-dashed border-brand-border rounded-xl p-10 bg-brand-surface/40">
                <h3 className="font-bold text-base text-white">Chưa có video nào trong Watchlist</h3>
                <p className="text-xs sm:text-sm text-zinc-400 mt-1 max-w-sm mx-auto">
                  Tại tab "Tìm xu hướng", hãy bấm nút <b>Theo dõi</b> ở bất kỳ video nào bạn muốn theo dõi.
                </p>
              </div>
            )}

            <div className="grid md:grid-cols-2 gap-4">
              {watchList.map(w => {
                const first = w.snaps[0], last = w.snaps[w.snaps.length - 1];
                const gain = last.v - first.v;
                const hrs = (last.t - first.t) / 36e5;
                const ytUrl = 'https://www.youtube.com/watch?v=' + w.id;
                return (
                  <article key={w.id} className="bg-brand-surface border border-brand-border rounded-xl p-4 flex flex-col sm:flex-row gap-3">
                    <img src={w.thumb} alt="" className="w-full sm:w-36 aspect-video object-cover rounded-xl bg-zinc-900 flex-shrink-0" />
                    <div className="flex-1 space-y-2 text-xs">
                      <h3 className="font-bold text-sm text-white line-clamp-2 leading-snug">{w.title}</h3>
                      <div className="text-zinc-400">{w.channel} · Đăng {fmtD(w.published)}</div>
                      <div className="bg-brand-card p-2.5 rounded-lg border border-brand-border space-y-1">
                        <div>View hiện tại: <b className="text-white text-sm">{fmt(last.v)}</b> · Snapshot: <b>{w.snaps.length} lần</b></div>
                        {w.snaps.length < 2 ? (
                          <div className="text-amber-400 text-[11px]">Cần ít nhất 2 lần bấm "Cập nhật" sau ít phút để đo tốc độ tăng.</div>
                        ) : (
                          <div className="text-emerald-400 font-semibold text-[11px]">
                            Tăng thêm: +{fmt(gain)} view trong {hrs.toFixed(2)} giờ ({hrs > 0 ? fmt(gain / hrs) : 'N/A'} view/giờ thực tế)
                          </div>
                        )}
                      </div>
                      <div className="flex flex-wrap gap-1.5 pt-1">
                        <a href={ytUrl} target="_blank" rel="noopener noreferrer" className="px-3 py-1.5 rounded-lg font-semibold bg-red-600 hover:bg-red-500 text-white transition flex items-center">
                          Xem trên YouTube
                        </a>
                        <button onClick={() => setDownloadVideo(w)} className="px-3 py-1.5 rounded-lg font-medium bg-emerald-600/20 text-emerald-300 border border-emerald-500/30">
                          Tải về
                        </button>
                        <button onClick={() => setWatch(x => { const n = { ...x }; delete n[w.id]; return n; })} className="px-3 py-1.5 rounded-lg text-zinc-400 hover:text-red-400 bg-brand-card hover:bg-brand-hover border border-brand-border">
                          Bỏ theo dõi
                        </button>
                      </div>
                    </div>
                  </article>
                );
              })}
            </div>
          </section>
        )}
      </main>

      {/* Footer */}
      <footer className="border-t border-brand-border py-4 text-center text-xs text-zinc-500 bg-brand-surface/40">
        YouTrend Analytics · Dữ liệu chính thống từ YouTube Data API v3.
      </footer>

      {/* API Key Configuration Modal */}
      {showKeyBox && (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowKeyBox(false)}>
          <div className="bg-brand-surface border border-brand-border rounded-xl p-6 w-full max-w-md space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between border-b border-brand-border pb-3">
              <h2 className="font-bold text-base text-white">Cấu hình YouTube API Key</h2>
              <button onClick={() => setShowKeyBox(false)} className="text-zinc-400 hover:text-white">✕</button>
            </div>
            <div className="space-y-2">
              <label className="text-xs text-zinc-300 font-semibold">Dán Google API Key (bắt đầu bằng AIza...):</label>
              <input 
                className={inp} 
                type={showKey ? 'text' : 'password'} 
                placeholder="AIzaSy..." 
                value={keyDraft} 
                onChange={e => setKeyDraft(e.target.value)} 
              />
              <div className="flex items-center justify-between text-xs text-zinc-400">
                <label className="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" checked={showKey} onChange={e => setShowKey(e.target.checked)} className="rounded bg-brand-card" />
                  Hiện ký tự key
                </label>
                <a href="https://console.cloud.google.com/apis/credentials" target="_blank" rel="noreferrer" className="text-red-400 hover:underline">
                  Lấy key ở đâu?
                </a>
              </div>
            </div>
            <div className="text-[11px] text-zinc-400 bg-brand-card p-3 rounded-lg border border-brand-border">
              Key chỉ lưu duy nhất trong bộ nhớ trình duyệt của bạn (localStorage), không gửi ra ngoài.
            </div>
            <div className="flex gap-2 justify-end pt-2">
              {key && <button onClick={removeKey} className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-red-950 text-red-400 hover:bg-red-900 border border-red-800 transition">Xóa key</button>}
              <button onClick={() => setShowKeyBox(false)} className={bSecondary}>Đóng</button>
              <button onClick={saveKey} className={bPrimary}>Lưu API Key</button>
            </div>
          </div>
        </div>
      )}

      {/* Analytics Breakdown Modal */}
      {detail && (() => {
        const v = detail, s = v.sc;
        const ytUrl = 'https://www.youtube.com/watch?v=' + v.id;
        const rows = [
          ['Tốc độ xem ước lượng (Speed)', s.speed, 40, fmt(s.vph) + ' view/giờ. Đánh giá tốc độ gia tăng lượt xem so với thời gian phát hành.'],
          ['Độ mới (Freshness)', s.fresh, 20, 'Video đăng cách đây ' + s.hours.toFixed(1) + ' giờ. Càng mới điểm càng cao.'],
          ['Tỷ lệ tương tác (Engagement)', s.eng, 20, 'Tương tác (Like + Bình luận)/View = ' + s.engPercent + '%. Video có tương tác cao hơn dễ viral.'],
          ['Hiệu suất so với kênh (Relative)', s.rel, 20, s.ratio == null ? 'Kênh ẩn số subscribers.' : 'Lượt xem gấp ' + s.ratio.toFixed(2) + ' lần lượng sub của kênh (Tín hiệu bứt phá khỏi tệp fan cũ).']
        ];
        return (
          <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-start justify-center p-4 overflow-y-auto" onClick={() => setDetail(null)}>
            <div className="bg-brand-surface border border-brand-border rounded-xl p-6 w-full max-w-2xl space-y-5 my-8 shadow-2xl" onClick={e => e.stopPropagation()}>
              <div className="flex gap-3 items-start justify-between border-b border-brand-border pb-4">
                <div className="flex gap-3">
                  <img src={v.thumb} alt="" className="w-28 sm:w-36 aspect-video object-cover rounded-xl bg-zinc-900" />
                  <div>
                    <h2 className="font-bold text-sm sm:text-base text-white line-clamp-2 leading-snug">{v.title}</h2>
                    <div className="text-xs text-zinc-400 mt-1">{v.channel} · {fmtD(v.published)}</div>
                  </div>
                </div>
                <button onClick={() => setDetail(null)} className="w-8 h-8 rounded-lg bg-brand-card hover:bg-brand-hover text-zinc-400 hover:text-white flex items-center justify-center">✕</button>
              </div>

              {/* Stats Grid */}
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs">
                {[
                  ['Lượt xem', fmt(v.views)],
                  ['Lượt thích', fmt(v.likes)],
                  ['Bình luận', fmt(v.comments)],
                  ['Subscribers kênh', fmt(v.subs)],
                  ['Thời lượng', fmtDur(v.dur)],
                  ['Tốc độ VPH', fmt(s.vph) + ' / giờ']
                ].map(x => (
                  <div key={x[0]} className="bg-brand-card rounded-lg p-2.5 border border-brand-border">
                    <div className="text-zinc-400 text-[11px]">{x[0]}</div>
                    <div className="font-bold text-sm text-white mt-0.5">{x[1]}</div>
                  </div>
                ))}
              </div>

              {/* Trend Score Factors */}
              <div>
                <div className="flex items-center justify-between mb-3">
                  <h3 className="font-bold text-sm text-white">Chỉ số Trend Score chi tiết</h3>
                  <span className={`px-2.5 py-1 rounded-lg font-bold text-sm ${scoreCls(s.total)}`}>{s.total} / 100</span>
                </div>
                <div className="space-y-3 bg-brand-card p-4 rounded-xl border border-brand-border">
                  {rows.map(r => (
                    <div key={r[0]}>
                      <div className="flex justify-between text-xs text-zinc-300 font-semibold">
                        <span>{r[0]}</span>
                        <b className="text-white">{r[1].toFixed(1)} / {r[2]}</b>
                      </div>
                      <div className="h-1.5 bg-brand-border rounded-full mt-1.5 overflow-hidden">
                        <div className="h-full bg-red-600 rounded-full" style={{ width: (r[1] / r[2] * 100) + '%' }}></div>
                      </div>
                      <div className="text-[11px] text-zinc-400 mt-1">{r[3]}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="flex flex-wrap gap-2 pt-2 border-t border-brand-border justify-end">
                <a href={ytUrl} target="_blank" rel="noopener noreferrer" className={bPrimary}>
                  Xem trên YouTube
                </a>
                <button onClick={() => { setDetail(null); setDownloadVideo(v); }} className={bSecondary}>
                  Tải video & MP3
                </button>
              </div>
            </div>
          </div>
        );
      })()}

      {/* Download Video Modal */}
      {downloadVideo && (
        <DownloadModal video={downloadVideo} onClose={() => setDownloadVideo(null)} onCopy={copyText} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

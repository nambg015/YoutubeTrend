        return;
      }

      const tagMap = {};
      vids.forEach(v => {
        const tags = v.snippet.tags || [];
        const views = Number(v.statistics?.viewCount || 0);
        const publishedAt = new Date(v.snippet.publishedAt);
        const hours = Math.max(0.5, (Date.now() - publishedAt.getTime()) / 36e5);
        const vph = Math.round(views / hours);
        const catId = v.snippet.categoryId;
        const catName = YT_CATEGORY_MAP[catId] || 'Giải trí';

        tags.forEach(t => {
          const clean = t.trim().replace(/^#+/, '');
          const lower = clean.toLowerCase();
          if (clean.length >= 2 && clean.length <= 45 && !/^\d+$/.test(clean)) {
            if (!tagMap[lower]) {
              tagMap[lower] = {
                kw: clean,
                count: 0,
                totalViews: 0,
                maxVph: 0,
                catCounts: {},
                videos: [],
                coTags: {}
              };
            }
            tagMap[lower].count += 1;
            tagMap[lower].totalViews += views;
            tagMap[lower].maxVph = Math.max(tagMap[lower].maxVph, vph);
            tagMap[lower].catCounts[catName] = (tagMap[lower].catCounts[catName] || 0) + 1;

            if (tagMap[lower].videos.length < 5) {
              tagMap[lower].videos.push({
                id: v.id,
                title: v.snippet.title,
                channel: v.snippet.channelTitle,
                views,
                vph,
                catName
              });
            }

            tags.forEach(other => {
              const otherClean = other.trim().replace(/^#+/, '');
              if (otherClean.toLowerCase() !== lower && otherClean.length >= 3) {
                tagMap[lower].coTags[otherClean] = (tagMap[lower].coTags[otherClean] || 0) + 1;
              }
            });
          }
        });
      });

      const rpmMap = {
        'Khoa học & Công nghệ': '$15 - $35',

            : comp === 'Trung bình'

            : ('Chủ đề cực nóng với ' + item.count + ' video cùng lên bảng xếp hạng thịnh hành (Tổng ' + fmt(item.totalViews) + ' view). Cạnh tranh giữa các kênh lớn.');

            .map(([t]) => t)

            id: 'real_yt_' + idx + '_' + Date.now(),
            kw: item.kw,
            period: '24',
            cat: 'general',
            catName: topCat,
            region: reg,

            avgViews: Math.round(item.totalViews / Math.max(1, item.count)),
            maxVph: item.maxVph,

            hotScore,

            timeline: { '72h': 20, '48h': 50, '24h': 100 },

            targetAudience: 'Khán giả đang theo dõi các video thịnh hành nhất danh mục ' + topCat + '.',

        out = out.filter(v => v.subs == null || v.subs <= 100000);
      }

      if (targetView === 'steady') {
        out = out.filter(v => v.views >= 1000 && v.views <= 60000);
      }

      if (targetDur === 'long') {
        out = out.filter(v => v.dur >= 1200);
      }

      out.sort((a, b) => b.views - a.views);

      if (!out.length) {
        out = getSampleItems();
      }

      setRpmItems(out);
    } catch (e) {
      setRpmItems(getSampleItems());
    } finally {
      setRpmLoading(false);
    }
  }

    setActivePreset(preset.id);
    const updated = {
      ...f,
      cat: preset.cat,
      period: preset.period,
      vtype: preset.vtype || 'all'
    };
    setF(updated);

    if (preset.sort) setSort(preset.sort);

      cat: preset.cat,

    });
  }

  const shown = useMemo(() => {
    const mv = Number(applied.minViews) || 0;
    return items
      .filter(v => v.views >= mv)
      .filter(v => {
        if (applied.vtype === 'all') return true;
        if (applied.vtype === 'short') return v.dur <= 60;
        if (applied.vtype === 'brief') return v.dur > 60 && v.dur <= 300;
        if (applied.vtype === 'medium') return v.dur > 300 && v.dur <= 1200;
        if (applied.vtype === 'long') return v.dur > 1200;
        return true;
      })
      .sort((a, b) => {
        if (sort === 'total') return b.total - a.total;
        if (sort === 'vph') return b.vph - a.vph;
        if (sort === 'views') return b.views - a.views;
        if (sort === 'ts') return b.ts - a.ts;

  async function updateSnaps() {
    const ids = Object.keys(watch);
    if (!ids.length) return;
    if (!key) { setError({ code: 'MISSING' }); return; }
    setBusy(true);
    setError(null);
    try {
      const cur = {};
      for (let i = 0; i < ids.length; i += 50) {
        const r = await yt('videos', { part: 'statistics', id: ids.slice(i, i + 50).join(',') }, key);
        (r.items || []).forEach(x => { cur[x.id] = Number(x.statistics.viewCount || 0); });
      }
      const t = Date.now();
      setWatch(w => {
        const n = { ...w };
        Object.keys(cur).forEach(id => {
          if (n[id]) n[id] = { ...n[id], snaps: [...n[id].snaps, { t, v: cur[id] }] };
        });
        return n;
      });
      showToast('Đã cập nhật snapshot mới nhất!');
    } catch (e) {
      setError(e);
    } finally {
      setBusy(false);

  }

    const esc = x => { const s = String(x == null ? '' : x); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const head = ['Tiêu đề', 'Kênh', 'Link', 'Ngày đăng', 'Lượt xem', 'Lượt thích', 'Bình luận', 'Subscribers', 'Views/Giờ', 'Trend Score'];

    const csv = '\uFEFF' + [head, ...rows].map(r => r.map(esc).join(',')).join('\r\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = 'youtrend-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);

      {tab !== 'rpm' && autoUpdateData.pendingTrends?.length > 0 && (
        <div className="fixed bottom-20 md:bottom-6 right-4 sm:right-6 z-40 flex flex-col items-end">
          {showAutoUpdateBubblePopup && (
            <div className="mb-2 w-72 sm:w-80 p-3.5 rounded-2xl bg-zinc-900/95 border border-purple-500/40 shadow-2xl backdrop-blur-xl animate-in fade-in zoom-in-95 duration-200">
              <div className="flex items-start justify-between gap-2">
                <div className="flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-purple-400 animate-ping"></span>
                  <span className="text-xs font-bold text-white">Xu hướng mới bứt phá!</span>
                </div>
                <button
                  onClick={() => setShowAutoUpdateBubblePopup(false)}
                  className="text-zinc-400 hover:text-white text-xs">✕</button>
              </div>
              <p className="text-[11px] text-zinc-300 mt-1.5 leading-relaxed">
                Hôm nay phát hiện <b className="text-purple-300">{autoUpdateData.pendingTrends.length} xu hướng mới</b> bứt phá từ kênh sub thấp!
              </p>
              <button
                onClick={() => { setShowPendingTrendsModal(true); setShowAutoUpdateBubblePopup(false); }}
                className="mt-2.5 w-full py-1.5 px-3 rounded-xl text-xs font-bold bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white shadow-md transition flex items-center justify-center gap-1.5 cursor-pointer">
                <span>Xem & Duyệt Trend Ngay</span>
                <span>→</span>
              </button>
            </div>
          )}

          {/* The Chat Head / Bubble */}
          <button
            onClick={() => setShowPendingTrendsModal(true)}
            className="relative w-12 h-12 rounded-full bg-gradient-to-br from-purple-600 via-indigo-600 to-purple-800 text-white shadow-xl shadow-purple-950/60 border-2 border-purple-300/40 hover:scale-110 active:scale-95 transition-all flex items-center justify-center group cursor-pointer"
            title="Thông báo: Có xu hướng mới đang bứt phá!">
            <span className="text-lg">⚡</span>
            <span className="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-rose-500 text-white text-[10px] font-black flex items-center justify-center shadow-md animate-pulse">
              {autoUpdateData.pendingTrends.length}
            </span>
          </button>
        </div>
      )}

      {/* Mobile Bottom Navigation Bar - Native App Style */}
      <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-[#0e1017]/95 backdrop-blur-xl border-t border-brand-border pb-safe select-none shadow-[0_-4px_24px_rgba(0,0,0,0.6)]">
        <div className="grid grid-cols-5 h-14 items-stretch">
          {/* Tab 1: Xu hướng */}
          <button 
            type="button"
            onClick={() => { setTab('search'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
            className={`flex flex-col items-center justify-center py-1 transition relative cursor-pointer ${
              tab === 'search' ? 'text-red-500 font-bold' : 'text-zinc-400 hover:text-zinc-200'
            }`}>
            {tab === 'search' && (
              <span className="absolute top-0 left-1/2 -translate-x-1/2 w-8 h-0.5 bg-red-500 rounded-full shadow-sm shadow-red-500/50"></span>
            )}
            <span className="text-lg leading-none">🔥</span>
            <span className="text-[10px] tracking-tight mt-1">Xu hướng</span>
          </button>

          {/* Tab 2: Từ khoá */}
          <button 
            type="button"
            onClick={() => { setTab('keywords'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
            className={`flex flex-col items-center justify-center py-1 transition relative cursor-pointer ${
              tab === 'keywords' ? 'text-red-500 font-bold' : 'text-zinc-400 hover:text-zinc-200'
            }`}>
            {tab === 'keywords' && (
              <span className="absolute top-0 left-1/2 -translate-x-1/2 w-8 h-0.5 bg-red-500 rounded-full shadow-sm shadow-red-500/50"></span>
            )}
            <span className="text-lg leading-none">🔍</span>
            <span className="text-[10px] tracking-tight mt-1">Từ khoá</span>
          </button>

          {/* Tab 3: Phân Tích */}
          <button 
            type="button"
            onClick={() => { setTab('niche'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
            className={`flex flex-col items-center justify-center py-1 transition relative cursor-pointer ${
              tab === 'niche' ? 'text-red-500 font-bold' : 'text-zinc-400 hover:text-zinc-200'
            }`}>
            {tab === 'niche' && (
              <span className="absolute top-0 left-1/2 -translate-x-1/2 w-8 h-0.5 bg-red-500 rounded-full shadow-sm shadow-red-500/50"></span>
            )}
            <span className="text-lg leading-none">🎯</span>
            <span className="text-[10px] tracking-tight mt-1">Phân Tích</span>
          </button>

          {/* Tab 4: Top Ngách */}
          <button 
            type="button"
            onClick={() => { setTab('rpm'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
            className={`flex flex-col items-center justify-center py-1 transition relative cursor-pointer ${
              tab === 'rpm' ? 'text-amber-400 font-bold' : 'text-zinc-400 hover:text-zinc-200'
            }`}>
            {tab === 'rpm' && (
              <span className="absolute top-0 left-1/2 -translate-x-1/2 w-8 h-0.5 bg-amber-400 rounded-full shadow-sm shadow-amber-400/50"></span>
            )}
            <span className="text-lg leading-none">🏆</span>
            <span className="text-[10px] tracking-tight mt-1">Top Ngách</span>
          </button>

          {/* Tab 5: Menu / Thêm */}
          <button 
            type="button"
            onClick={() => setMobileDrawerOpen(true)}
            className="flex flex-col items-center justify-center py-1 text-zinc-400 hover:text-zinc-200 relative transition cursor-pointer">
            <div className="relative leading-none">
              <span className="text-lg">⚡</span>
              {(autoUpdateData.pendingTrends?.length > 0 || competitors.length > 0) && (
                <span className="absolute -top-1 -right-1.5 w-2 h-2 rounded-full bg-purple-500 animate-ping"></span>
              )}
            </div>
            <span className="text-[10px] tracking-tight mt-1">Thêm</span>
          </button>
        </div>
      </nav>
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, errorInfo) {
    console.error("ErrorBoundary caught:", error, errorInfo);
  }
  render() {
    if (this.state.hasError) {
      if (this.props.fallback !== undefined) {
        return this.props.fallback;
      }
      return (
        <div className="min-h-screen bg-[#0b0c10] text-zinc-200 flex flex-col items-center justify-center p-6 text-center">
          <div className="max-w-lg bg-[#181b26] border border-[#232738] rounded-2xl p-6 shadow-2xl space-y-4">
            <h2 className="text-base font-bold text-white">Đã xảy ra sự cố hiển thị</h2>
            <p className="text-xs text-zinc-400">
              Trang web đã tự động phục hồi an toàn. Bạn có thể bấm nút bên dưới để tiếp tục trải nghiệm.
            </p>
            {this.state.error && (
              <div className="p-3 bg-red-950/40 border border-red-500/30 rounded-xl text-left text-xs text-red-300 font-mono break-all max-h-48 overflow-y-auto">
                <div className="font-bold">{this.state.error.name || 'Error'}: {this.state.error.message || String(this.state.error)}</div>
                {this.state.error.stack && <div className="text-[10px] text-zinc-500 mt-1 whitespace-pre-wrap">{this.state.error.stack}</div>}
              </div>
            )}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={() => { this.setState({ hasError: false }); window.location.reload(); }}
                className="px-4 py-2 rounded-lg text-xs font-semibold bg-zinc-100 hover:bg-white text-zinc-950 transition cursor-pointer">
                Tải lại trang web
              </button>
              <button
                onClick={() => { this.setState({ hasError: false }); window.location.href = window.location.pathname; }}
                className="px-4 py-2 rounded-lg text-xs font-medium bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700 transition cursor-pointer">
                Về trang chủ
              </button>
            </div>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>
);
</script>
</body>

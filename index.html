<style>
  /* ===== Phong cách YouTube tối trên nền ảnh sóng 4K nét: thẻ #212121, chữ #f1f1f1 / #aaa, xanh #3ea6ff ===== */
  :root { --ground: #0f0f0f; --card: #212121; --card-hover: #272727; --line: #303030; --text: #f1f1f1; --muted: #aaaaaa; --accent: #3ea6ff; color-scheme: dark; }
  html { background: var(--ground); } body { background: transparent; } html, body { color: var(--text); overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; z-index: -2; background: url('./bg_wave_4k_v2.jpg') center / cover no-repeat, var(--ground); }
  body::after { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(90deg, rgba(10,12,20,.62) 0%, rgba(10,12,20,.42) 50%, rgba(10,12,20,.3) 100%); }
  #root { position: relative; }
  body { font-family: Roboto, "Be Vietnam Pro", Arial, sans-serif; font-size: 12.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  h1, h2, h3 { text-wrap: balance; letter-spacing: -0.01em; }
  .brand { font-family: Lobster, Roboto, "Be Vietnam Pro", sans-serif; font-weight: 400; letter-spacing: .01em; text-shadow: 0 1px 10px rgba(0,0,0,.45); }
  .font-display { font-family: Roboto, "Be Vietnam Pro", Arial, sans-serif; }
  ::selection { background: rgba(62,166,255,.4); color: #fff; }
  * { caret-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  a { text-underline-offset: 3px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #3f3f3f; border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; } ::-webkit-scrollbar-thumb:hover { background: #717171; background-clip: padding-box; }
  html { scrollbar-color: #3f3f3f transparent; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { scrollbar-width: none; }
  input[type=checkbox], input[type=radio] { accent-color: var(--accent); }
  select option { background: #212121; color: #f1f1f1; }
  .tabular-nums, .num { font-variant-numeric: tabular-nums; }
  /* thẻ obsidian */
  .yt-card { background: #212121; border: 1px solid transparent; border-radius: 12px; transition: background-color .15s, border-color .15s; } .yt-card:hover { background-color: #272727; }
  .yt-cell { background: #181818; border-radius: 8px; }
  /* con dấu "đáng làm" (kênh farm) */
  .seal { position: relative; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; width: 40px; height: 40px; background: #2ba640; color: #fff; border-radius: 8px; line-height: 1; }
  .seal b { font-family: Roboto, sans-serif; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
  .seal span { margin-top: 1px; font-size: 7.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
  .seal.sm { width: 26px; height: 26px; border-radius: 8px; }
  .seal.sm b { font-size: 11px; }
  @media (prefers-reduced-motion: no-preference) { .seal.stamp { animation: stamp .45s cubic-bezier(.16,1,.3,1) both; } .yt-rise { animation: rise .4s cubic-bezier(.16,1,.3,1) both; } }
  @keyframes stamp { from { transform: scale(1.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes rise { from { transform: translateY(8px); opacity: .001; } to { transform: none; opacity: 1; } }
</style>

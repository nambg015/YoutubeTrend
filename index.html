<style>
  /* ===== Phong cách CutLab "obsidian": nền ảnh mờ + ánh sáng loang, thẻ đen than, chữ trắng ===== */
  :root {
    --ground: #0b0c10; --card: #141620; --card-hover: #191c28; --cell: rgba(255,255,255,.045); --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.16);
    --text: #ffffff; --muted: #9ba3b4; --accent: #fbbf24; --jade: #4fc1a8; --orange: #ff7a29; --purple: #a855f7;
    color-scheme: dark;
  }
  html { background: var(--ground); } body { background: transparent; } html, body { color: var(--text); overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: -15px; z-index: -2; background: url('./bg_4k.jpg') center / cover no-repeat, var(--ground); filter: blur(8px) brightness(.9); transform: scale(1.04); }
  body::after { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none; background:
      radial-gradient(440px 440px at 4% 6%, rgba(255,160,40,.16), transparent 70%),
      radial-gradient(420px 420px at 96% 4%, rgba(168,85,247,.18), transparent 70%),
      radial-gradient(520px 380px at 46% 18%, rgba(79,70,229,.12), transparent 70%),
      linear-gradient(180deg, rgba(12,13,20,.55), rgba(12,13,20,.78)); }
  #root { position: relative; }
  body { font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  h1, h2, h3 { text-wrap: balance; letter-spacing: -0.025em; }
  .font-display { font-family: "Space Grotesk", "Be Vietnam Pro", system-ui, sans-serif; }
  ::selection { background: rgba(251,191,36,.35); color: #fff; }
  * { caret-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
  a { text-underline-offset: 3px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; } ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.24); background-clip: padding-box; }
  html { scrollbar-color: rgba(255,255,255,.16) transparent; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { scrollbar-width: none; }
  input[type=checkbox], input[type=radio] { accent-color: var(--accent); }
  select option { background: #141620; color: #fff; }
  .tabular-nums, .num { font-variant-numeric: tabular-nums; }
  /* thẻ obsidian */
  .yt-card { background: rgba(20,22,32,.94); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 36px rgba(0,0,0,.45); transition: border-color .2s, background-color .2s, transform .2s; }
  .yt-cell { background: var(--cell); border: 1px solid rgba(255,255,255,.05); border-radius: 10px; }
  /* con dấu "đáng làm" (kênh farm) */
  .seal { position: relative; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; width: 54px; height: 54px; background: linear-gradient(145deg, #5fd3b8, #2f9e86); color: #04201a; border-radius: 14px; box-shadow: 0 8px 22px -6px rgba(79,193,168,.55), inset 0 1px 0 rgba(255,255,255,.35); line-height: 1; }
  .seal b { font-family: "Space Grotesk", sans-serif; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
  .seal span { margin-top: 3px; font-size: 8.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
  .seal.sm { width: 26px; height: 26px; border-radius: 8px; }
  .seal.sm b { font-size: 11px; }
  @media (prefers-reduced-motion: no-preference) { .seal.stamp { animation: stamp .45s cubic-bezier(.16,1,.3,1) both; } .yt-rise { animation: rise .4s cubic-bezier(.16,1,.3,1) both; } }
  @keyframes stamp { from { transform: scale(1.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes rise { from { transform: translateY(8px); opacity: .001; } to { transform: none; opacity: 1; } }
</style>

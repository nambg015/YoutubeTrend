// Dynamic keyword analysis generator for any user custom query
function generateCustomKeywordAnalysis(query, selectedPeriod = '24', selectedCat = 'all', selectedRegion = 'VN') {
  const cleanQ = (query || '').trim();
  if (!cleanQ) return null;

  let hash = 0;
  for (let i = 0; i < cleanQ.length; i++) {
    hash = (hash << 5) - hash + cleanQ.charCodeAt(i);
    hash |= 0;
  }
  const abs = Math.abs(hash);
  const pNum = Number(selectedPeriod) || 24;
  const multiplier = pNum === 24 ? 1 : pNum === 48 ? 1.4 : pNum === 72 ? 1.8 : pNum === 168 ? 2.8 : 4.2;

  const baseVol = 45000 + (abs % 450000);
  const volume = Math.round(baseVol * multiplier);

  const baseGrowth = pNum === 24 ? (280 + (abs % 450)) : pNum === 48 ? (190 + (abs % 360)) : pNum === 72 ? (140 + (abs % 280)) : (90 + (abs % 210));
  const hotScore = Math.min(99, Math.max(74, 82 + (abs % 17)));

  const compTypes = ['Thấp', 'Trung bình', 'Cao'];
  const compIndex = (cleanQ.split(' ').length >= 4) ? 0 : (abs % 3);
  const competition = compTypes[compIndex];

  const compNotes = {
    'Thấp': 'Độ cạnh tranh thấp, từ khóa ngách tiềm năng cao giúp kênh mới dễ ăn đề xuất nhanh.',
    'Trung bình': 'Độ cạnh tranh vừa phải, cần tối ưu tiêu đề chuẩn SEO và ảnh bìa thumbnail thật cuốn hút.',
    'Cao': 'Chủ đề hot có nhiều kênh lớn bao phủ, nên tạo nội dung theo góc nhìn mới lạ hoặc định dạng Shorts.'
  };

  const lower = cleanQ.toLowerCase();
  let rpm = '$8 - $18';
  if (/ai|kiếm tiền|tài chính|finance|crypto|kinh doanh|invest|wealth|bất động sản|marketing/.test(lower)) {
    rpm = '$22 - $46';
  } else if (/review|công nghệ|tech|phone|laptop|xe|ô tô/.test(lower)) {
    rpm = '$15 - $32';
  } else if (/gaming|game|chơi game|minecraft|roblox/.test(lower)) {
    rpm = '$6 - $14';
  } else if (/nhạc|music|lofi|remix|bài hát/.test(lower)) {
    rpm = '$6 - $12';
  }

  const relatedKeywords = [
    cleanQ + ' mới nhất',
    cleanQ + ' hướng dẫn chi tiết',
    'cách làm ' + cleanQ,
    cleanQ + ' 2026',
    cleanQ + ' cho người mới bắt đầu',
    'đánh giá ' + cleanQ,
    cleanQ + ' kinh nghiệm thực tế'
  ];

  const titleIdeas = [
    `${cleanQ}: Hướng Dẫn Toàn Tập Cho Người Mới Bắt Đầu`,
    `Sự Thật Về ${cleanQ} Mà Chưa Ai Tiết Lộ Cho Bạn`,
    `Tôi Đã Thử ${cleanQ} Trong 30 Ngày Và Đây Là Kết Quả`,
    `Top 5 Sai Lầm Phổ Biến Khi Làm ${cleanQ} Bạn Cần Tránh`,
    `Bí Quyết Đột Phá Triệu View Với Chủ Đề ${cleanQ}`
  ];

  const catObj = KEYWORD_CATEGORIES.find(c => c.id === selectedCat);

  return {
    id: 'custom_' + abs + '_' + pNum,
    kw: cleanQ,
    period: String(selectedPeriod),
    cat: selectedCat !== 'all' ? selectedCat : 'general',
    catName: catObj && catObj.id !== 'all' ? catObj.label : 'Tổng hợp xu hướng',
    region: selectedRegion === 'all' ? 'VN' : selectedRegion,
    volume,
    growth: baseGrowth,
    hotScore,
    competition,
    competitionNote: compNotes[competition],
    rpm,
    recentVideos: Math.round(40 + (abs % 400)),
    timeline: {
      '72h': Math.round(25 + (abs % 25)),
      '48h': Math.round(50 + (abs % 30)),
      '24h': 100
    },
    reason: `Lượng tìm kiếm về "${cleanQ}" đang có xu hướng tăng đột biến trong ${selectedPeriod} giờ qua trên YouTube. Khán giả tìm kiếm các video thực tế, phân tích và hướng dẫn cụ thể.`,
    targetAudience: 'Người dùng YouTube tìm kiếm thông tin chuyên sâu và giải pháp thực tế theo chủ đề này.',
    relatedKeywords,
    titleIdeas
  };
}

// YouTube Search Suggestions via JSONP (No CORS issues, real Google/YT data)
function fetchYtSuggestionsJsonp(query) {
  return new Promise((resolve) => {
    if (!query || !query.trim()) return resolve([]);
    const callbackName = 'yt_suggest_' + Math.random().toString(36).substring(2, 9);
    const script = document.createElement('script');
    let timer = setTimeout(() => {
      cleanup();
      resolve([]);
    }, 2500);

    function cleanup() {
      clearTimeout(timer);
      try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = function(data) {
      cleanup();
      try {
        if (Array.isArray(data) && Array.isArray(data[1])) {
          const suggestions = data[1].map(item => Array.isArray(item) ? item[0] : item).filter(Boolean);
          resolve(suggestions);
        } else {
          resolve([]);
        }
      } catch (e) {
        resolve([]);
      }
    };

    script.src = 'https://suggestqueries.google.com/complete/search?client=youtube&ds=yt&q=' + encodeURIComponent(query.trim()) + '&jsonp=' + callbackName;
    script.onerror = () => {
      cleanup();
      resolve([]);
    };
    document.body.appendChild(script);
  });
}

// Export Keywords to CSV helper
function exportKeywordsCsv(items, periodLabel, showToast) {
  if (!items || !items.length) {
    if (showToast) showToast('Không có dữ liệu từ khóa để xuất file!');
    return;
  }
  const esc = t => '"' + String(t || '').replace(/"/g, '""') + '"';
  const head = ['Từ Khóa', 'Khung Thời Gian', 'Lĩnh Vực', 'Khu Vực', 'Lượng Tìm Kiếm Ước Tính', 'Tăng Trưởng (%)', 'Điểm Hot', 'Độ Cạnh Tranh', 'RPM Ước Tính', 'Video Mới', 'Từ Khóa Liên Quan', 'Gợi Ý Tiêu Đề'];
  const rows = items.map(k => [
    k.kw,
    k.period + ' giờ qua',
    k.catName || k.cat,
    k.region,
    k.volume,
    '+' + k.growth + '%',
    k.hotScore + '/100',
    k.competition,
    k.rpm,
    k.recentVideos,
    (k.relatedKeywords || []).join('; '),
    (k.titleIdeas || []).join(' | ')
  ]);
  const csv = '\uFEFF' + [head, ...rows].map(r => r.map(esc).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = 'youtrend-keywords-' + (periodLabel || 'trends') + '-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  if (showToast) showToast('Đã xuất file CSV từ khóa xu hướng thành công!');
}

// Mid-roll Ads & Revenue Estimation Helpers
const calcMidrolls = (durSeconds) => {
  const min = Math.floor((durSeconds || 0) / 60);
  if (min < 8) return 0;
  if (min < 15) return 1;
  if (min < 25) return 3;
  if (min < 45) return 5;
  if (min < 70) return 8;
  if (min < 100) return 12;
  return Math.min(25, Math.floor(min / 7));
};

const calcEstimatedRev = (views, durSeconds, avgRpm = 30) => {
  const midrolls = calcMidrolls(durSeconds);
  const v = Number(views) || 0;
  // Multiplier: every midroll ad watched adds ~0.6x effective view value
  const adFactor = midrolls > 0 ? (1 + midrolls * 0.6) : 1;
  const low = Math.round((v / 1000) * (avgRpm * 0.75) * adFactor);
  const high = Math.round((v / 1000) * (avgRpm * 1.35) * adFactor);
  return { low, high, midrolls };
};

const parseDur = iso => {

};

// Trend Scoring Algorithm
function score(v) {
  const hours = Math.max((Date.now() - new Date(v.published).getTime()) / 36e5, 0.5);
  const vph = v.views / hours;
  const speed = 40 * clamp(Math.log10(vph + 1) / 5);
  const fresh = 20 * (1 - clamp(Math.log10(hours + 1) / Math.log10(24 * 90 + 1)));
  const inter = (v.likes == null ? 0 : v.likes) + (v.comments == null ? 0 : v.comments);
  const rate = v.views > 0 ? inter / v.views : 0;
  const eng = 20 * clamp(Math.log10(1 + rate * 100) / Math.log10(11));
  const ratio = v.subs == null ? null : v.views / Math.max(v.subs, 1000);
  const rel = ratio == null ? 0 : 20 * clamp(Math.log10(ratio + 1) / Math.log10(11));
  const total = Math.round((speed + fresh + eng + rel) * 10) / 10;
  return { hours, vph, speed, fresh, eng, rel, rate, ratio, total, engPercent: (rate * 100).toFixed(2) };
}

// YouTube Data API Client
async function yt(path, params, key) {
  const u = new URL('https://www.googleapis.com/youtube/v3/' + path);
  Object.entries(params).forEach(([k, v]) => {
    if (v !== undefined && v !== null && v !== '') u.searchParams.set(k, v);
  });
  u.searchParams.set('key', key);
  let r;
  try {
    r = await fetch(u.toString());
  } catch (e) {
    throw { code: 'NETWORK', msg: String(e) };
  }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const e0 = j.error && j.error.errors && j.error.errors[0];
    throw { code: (e0 && e0.reason) || ('HTTP' + r.status), msg: (j.error && j.error.message) || '' };
  }
  return j;
}

function errInfo(e) {
  const c = e.code;
  if (c === 'MISSING') return { t: 'Chưa nhập YouTube API Key', s: ['Bấm nút "Cấu hình API Key" ở góc trên bên phải.', 'Dán API Key YouTube Data API v3 của bạn rồi bấm "Lưu".', 'Key chỉ lưu trong trình duyệt của bạn (localStorage) và hoàn toàn an toàn.'] };
  if (c === 'quotaExceeded' || c === 'dailyLimitExceeded' || c === 'rateLimitExceeded') return { t: 'Đã dùng hết Quota YouTube API trong ngày', s: ['Mỗi tài khoản Google mặc định được 10.000 đơn vị quota/ngày.', 'Mỗi lần tìm từ khóa tốn 100 đơn vị, trong khi xem bảng xếp hạng thịnh hành chỉ tốn 1 đơn vị.', 'Mẹo: Bạn có thể tạo thêm 1 project khác trên Google Cloud để lấy key phụ hoặc đợi quota reset (14h-15h VN).'] };
  if (c === 'keyInvalid' || c === 'badRequest' || c === 'HTTP400') return { t: 'API Key không hợp lệ', s: ['Kiểm tra bạn đã copy đúng và đủ mã key (không thừa ký tự trắng).', 'Vào Google Cloud Console > Credentials để kiểm tra key.', 'Đảm bảo API "YouTube Data API v3" đã được bấm ENABLE trong project.'] };
  if (c === 'ipRefererBlocked' || c === 'forbidden' || c === 'HTTP403' || c === 'accessNotConfigured') return { t: 'API Key bị từ chối truy cập (403)', s: ['Nếu bạn bật giới hạn Website Referrer, hãy tạm thời bỏ giới hạn hoặc thêm URL hiện tại.', 'Đảm bảo "YouTube Data API v3" đã được Bật trong Google Cloud Console.'] };
  if (c === 'NETWORK') return { t: 'Lỗi mạng hoặc bị chặn', s: ['Kiểm tra kết nối mạng Internet của bạn.', 'Tắt các tiện ích chặn quảng cáo nếu có thể gây chặn kết nối Google API.'] };
  return { t: 'Lỗi kết nối: ' + c, s: [e.msg || 'Vui lòng thử lại sau giây lát.'] };
}

// Car Speedometer Gauge Component (Strictly No Icons, Pure Modern Sports Car Cluster)
function CarSpeedometerGauge({ value = 0, max = 240, label = 'TỐC ĐỘ PHỦ SÓNG NGÁCH', unit = 'KM/H', tripText = '', statusText = '' }) {
  const clamped = Math.max(0, Math.min(max, Number(value) || 0));
  // Needle angle: -120 deg at 0 km/h, 0 deg at 120 km/h, +120 deg at 240 km/h
  const needleAngle = -120 + (clamped / max) * 240;

  // Determine color theme based on speed / saturation
  let zoneBadge = 'text-emerald-400 bg-emerald-500/10 border-emerald-500/30';
  let zoneLabel = 'VÙNG AN TOÀN - CƠ HỘI CAO';

  if (clamped >= 80 && clamped < 160) {
    zoneBadge = 'text-amber-400 bg-amber-500/10 border-amber-500/30';
    zoneLabel = 'VÙNG TĂNG TỐC - CẠNH TRANH VỪA';
  } else if (clamped >= 160) {
    zoneBadge = 'text-rose-400 bg-rose-500/10 border-rose-500/30';
    zoneLabel = 'VÙNG ĐỎ - BÃO HÒA CAO';
  }

  const ticks = [0, 40, 80, 120, 160, 200, 240];

  return (
    <div className="relative flex flex-col items-center justify-center p-4 rounded-2xl bg-gradient-to-b from-zinc-900 to-brand-surface border border-brand-border shadow-inner w-full">
      <div className="text-[10px] uppercase font-mono tracking-widest text-zinc-400 mb-1">
        {label}
      </div>

      {/* SVG Instrument Cluster Dial */}
      <div className="relative w-56 h-44 flex items-center justify-center overflow-hidden">
        <svg viewBox="0 0 260 220" className="w-full h-full">
          <defs>
            <linearGradient id="speedGaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stopColor="#10b981" />
              <stop offset="45%" stopColor="#10b981" />
              <stop offset="65%" stopColor="#f59e0b" />
              <stop offset="85%" stopColor="#f43f5e" />
              <stop offset="100%" stopColor="#e11d48" />
            </linearGradient>
            <filter id="needleGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="2" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>

          {/* Background Outer Ring Arc */}
          <path
            d="M 37.4 195 A 105 105 0 1 1 222.6 195"
            fill="none"
            stroke="#232738"
            strokeWidth="14"
            strokeLinecap="round"
          />

          {/* Active Colored Arc */}
          <path
            d="M 37.4 195 A 105 105 0 1 1 222.6 195"
            fill="none"
            stroke="url(#speedGaugeGrad)"
            strokeWidth="10"
            strokeLinecap="round"
            strokeDasharray="440"
            strokeDashoffset={440 - (clamped / 240) * 440}
            className="transition-all duration-700 ease-out"
          />

          {/* Tick Marks & Numbers */}
          {ticks.map((t) => {
            const angleDeg = -120 + (t / 240) * 240;
            const rad = (angleDeg - 90) * (Math.PI / 180);
            const x1 = 130 + 88 * Math.cos(rad);
            const y1 = 130 + 88 * Math.sin(rad);
            const x2 = 130 + 98 * Math.cos(rad);
            const y2 = 130 + 98 * Math.sin(rad);
            const tx = 130 + 74 * Math.cos(rad);
            const ty = 130 + 74 * Math.sin(rad);
            return (
              <g key={t}>
                <line x1={x1} y1={y1} x2={x2} y2={y2} stroke="#64748b" strokeWidth={t % 80 === 0 ? '2.5' : '1.5'} />
                <text x={tx} y={ty + 3} fill="#94a3b8" fontSize="8" fontWeight="bold" textAnchor="middle" fontFamily="monospace">
                  {t}
                </text>
              </g>
            );
          })}

          {/* Needle Pin (Rotates around center 130, 130) */}
          <g
            style={{
              transform: "rotate(" + needleAngle + "deg)",
              transformOrigin: "130px 130px",
              transition: "transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)"
            }}
            filter="url(#needleGlow)">
            <line x1="130" y1="130" x2="130" y2="40" stroke="#ff0040" strokeWidth="3" strokeLinecap="round" />
            <polygon points="127,130 133,130 130,35" fill="#ff2a55" />
          </g>

          {/* Center Hub */}
          <circle cx="130" cy="130" r="12" fill="#0b0c10" stroke="#ff0040" strokeWidth="2.5" />
          <circle cx="130" cy="130" r="5" fill="#e2e8f0" />
        </svg>

        {/* Digital Speedometer Center Display */}
        <div className="absolute bottom-1 flex flex-col items-center">
          <div className="flex items-baseline gap-1">
            <span className="font-mono text-2xl font-black tracking-tight text-white drop-shadow-md">
              {Math.round(clamped)}
            </span>
            <span className="text-[10px] font-mono font-bold text-zinc-400">
              {unit}
            </span>
          </div>
        </div>
      </div>

      {/* Odometer & Status Display */}
      <div className="w-full mt-2 flex flex-col items-center gap-1.5">
        <div className={"text-[10px] font-mono font-bold px-2.5 py-0.5 rounded border " + zoneBadge}>
          {statusText || zoneLabel}
        </div>
        {tripText && (

// Niche Deep Saturation & Competitor Breakdown Modal
function NicheDeepAnalyzeModal({ video, onClose, apiKey, onAddCompetitor, onCopy, showToast }) {
  const [activeTab, setActiveTab] = useState('all'); // 'all' | 'success' | 'flop'
  const [loading, setLoading] = useState(false);
  const [queryInput, setQueryInput] = useState(() => {
    if (!video || !video.title) return '';
    return video.title.replace(/[^wsÀ-ỹ]/gi, ' ').split(/s+/).filter(w => w.length > 2).slice(0, 5).join(' ');
  });
  const [analysisResult, setAnalysisResult] = useState(null);

  // Core analysis runner
  const performAnalysis = async (qText) => {
    const q = (qText || queryInput).trim();
    if (!q) return;
    setLoading(true);
    try {
      let itemsList = [];
      if (apiKey) {
        // Query live YouTube Data API
        const s = await yt('search', {
          part: 'snippet',
          type: 'video',
          q: q,
          maxResults: 35,
          order: 'viewCount'
        }, apiKey);
        const ids = (s.items || []).map(i => i.id && i.id.videoId).filter(Boolean);
        if (ids.length) {
          const vData = await yt('videos', { part: 'snippet,statistics,contentDetails', id: ids.join(',') }, apiKey);
          const vids = vData.items || [];
          const cids = [...new Set(vids.map(v => v.snippet.channelId))];
          const subsMap = {};
          if (cids.length) {
            const cData = await yt('channels', { part: 'statistics', id: cids.join(',') }, apiKey);
            (cData.items || []).forEach(x => {
              subsMap[x.id] = x.statistics.hiddenSubscriberCount ? null : Number(x.statistics.subscriberCount);
            });
          }
          itemsList = vids.map(v => {
            const views = Number(v.statistics?.viewCount || 0);
            const published = v.snippet.publishedAt;
            const hours = Math.max(0.5, (Date.now() - new Date(published).getTime()) / 36e5);
            const vph = Math.round(views / hours);
            const subs = subsMap[v.snippet.channelId] || null;
            return {
              id: v.id,
              title: v.snippet.title,
              channel: v.snippet.channelTitle,
              channelId: v.snippet.channelId,
              thumb: getBestThumb(v.snippet.thumbnails),
              published,
              views,
              vph,
              subs,
              daysOld: Math.round(hours / 24)
            };
          });
        }
      }

      // If no API or offline fallback data to ensure reliable verification
      if (!itemsList.length) {
        itemsList = [
          {
            id: 'v_breakout_1',
            title: video.title,
            channel: video.channel,
            channelId: video.channelId || 'ch_1',
            thumb: video.thumb,
            published: video.published,
            views: video.views,
            vph: video.vph || 420,
            subs: video.subs || 14000,
            daysOld: 3
          },
          {
            id: 'v_breakout_2',
            title: "What The Old Maid Revealed After 30 Years In The Mansion Shocked Everyone",
            channel: "Hidden Life Secrets",
            channelId: 'ch_2',
            thumb: "https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&w=400&q=80",
            published: new Date(Date.now() - 36e5 * 48).toISOString(),
            views: 48500,
            vph: 850,
            subs: 22000,
            daysOld: 2
          },
          {
            id: 'v_breakout_3',
            title: "He Fired His Loyal Driver, But What He Found Under The Driver's Seat Made Him Cry",
            channel: "Moral Compass Stories",
            channelId: 'ch_3',
            thumb: "https://images.unsplash.com/photo-1519791883288-dc8bd696e667?auto=format&fit=crop&w=400&q=80",
            published: new Date(Date.now() - 36e5 * 72).toISOString(),
            views: 89000,
            vph: 640,
            subs: 31000,
            daysOld: 3
          },
          {
            id: 'v_flop_1',
            title: "Story about billionaire and poor helper in big house",
            channel: "Daily Random Clips",
            channelId: 'ch_flop_1',
            thumb: "https://images.unsplash.com/photo-1507692049790-de58290a4334?auto=format&fit=crop&w=400&q=80",
            published: new Date(Date.now() - 36e5 * 24 * 18).toISOString(),
            views: 312,
            vph: 1,
            subs: 150,
            daysOld: 18,
            flopReason: "Tiêu đề generic không có hook tò mò, thumbnail tối, không có nhịp điệu mở đầu."
          },
          {
            id: 'v_flop_2',
            title: "Billionaire story part 2 sad lesson life 2026",
            channel: "Life Vlogs & News",
            channelId: 'ch_flop_2',
            thumb: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=400&q=80",
            published: new Date(Date.now() - 36e5 * 24 * 25).toISOString(),
            views: 540,
            vph: 2,
            subs: 420,
            daysOld: 25,
            flopReason: "Chất lượng âm thanh AI robot khô cứng, video quá ngắn (4 phút) không đủ giữ chân người xem."
          },
          {
            id: 'v_flop_3',
            title: "Maid moral story billionaire reaction",
            channel: "Fast Content Lab",
            channelId: 'ch_flop_3',
            thumb: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80",
            published: new Date(Date.now() - 36e5 * 24 * 14).toISOString(),
            views: 180,
            vph: 0,
            subs: 80,
            daysOld: 14,
            flopReason: "Ảnh đại diện thumbnail mờ nhạt, text trên ảnh quá nhiều chữ khó đọc trên điện thoại."
          }
        ];
      }

      // Categorize: Successful Breakouts vs Flops
      const successfulList = itemsList.filter(item => {
        return item.views >= 15000 || (item.subs && item.views >= item.subs * 1.5) || item.vph >= 40;
      });

      const flopList = itemsList.filter(item => {
        return item.views < 1500 || item.vph <= 3 || item.daysOld >= 7 && item.views < 2000;
      }).map(item => ({
        ...item,
        flopReason: item.flopReason || (item.views < 500 ? 'Tiêu đề thiếu yếu tố giật tít/tò mò, thumbnail đơn điệu không kích thích nhấp chuột.' : 'Đăng lâu nhưng tỷ lệ giữ chân (Retention) thấp khiến thuật toán ngừng đề xuất.')
      }));

      const totalChannels = itemsList.length;
      const successCount = successfulList.length;
      const flopCount = flopList.length;
      const winRate = Math.round((successCount / Math.max(1, successCount + flopCount)) * 100);

      // Speedometer value calculation (0 - 240 KM/H)
      // Saturation formula based on total actors and flop ratio
      const saturationSpeed = Math.min(235, Math.max(30, Math.round(totalChannels * 3.5 + successCount * 4 + flopCount * 2.5)));

      setAnalysisResult({
        keyword: q,
        totalChannels,
        successfulList,
        flopList,
        winRate,
        saturationSpeed,
        feasibilityScore: Math.round(winRate * 0.7 + (240 - saturationSpeed) * 0.3 * (100 / 240))
      });

      if (showToast) showToast('Lỗi khi quét ngách: ' + (e.msg || e.message || 'Lỗi mạng'));

      setLoading(false);

  const [showF12Blocked, setShowF12Blocked] = useState(false);

    const handleKeyDown = (e) => {
      // F12 key
      if (e.key === 'F12' || e.keyCode === 123) {
        e.preventDefault();
        e.stopPropagation();
        setShowF12Blocked(true);
        return false;
      }
      // Ctrl+Shift+I / J / C or Ctrl+U
      if (e.ctrlKey && ((e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) || e.key === 'u' || e.key === 'U')) {
        e.preventDefault();
        e.stopPropagation();
        setShowF12Blocked(true);
        return false;
      }
      // Mac Cmd+Option+I / J / C
      if (e.metaKey && (e.altKey && (e.key === 'i' || e.key === 'I' || e.key === 'j' || e.key === 'J' || e.key === 'c' || e.key === 'C') || e.key === 'u' || e.key === 'U')) {
        e.preventDefault();
        e.stopPropagation();
        setShowF12Blocked(true);
        return false;

    };

      let handle = '';

        handle = raw.slice(raw.indexOf('@')).split('/')[0].split('?')[0];
      } else if (raw.includes('/channel/')) {
        chId = raw.split('/channel/')[1].split('/')[0].split('?')[0];

        chId = raw;
      } else {
        handle = '@' + raw.replace(/^https?:\/\/(www\.)?youtube\.com\//, '').replace(/\s+/g, '');
      }

      let chData = null;
      if (key) {
        if (handle) {
          const r = await yt('channels', { part: 'snippet,statistics', forHandle: handle.replace('@', '') }, key).catch(() => null);
          if (r && r.items && r.items.length) chData = r.items[0];
        }
        if (!chData && chId) {
          const r = await yt('channels', { part: 'snippet,statistics', id: chId }, key).catch(() => null);
          if (r && r.items && r.items.length) chData = r.items[0];
        }
        if (!chData) {
          const s = await yt('search', { part: 'snippet', type: 'channel', q: raw, maxResults: 1 }, key).catch(() => null);

            const foundId = s.items[0].id.channelId;

          id: chData.id,
          title: chData.snippet.title,
          handle: handle || ('@' + (chData.snippet.customUrl || chData.snippet.title.replace(/\s+/g, '').toLowerCase())),

  // Load General YouTube Data
  async function load(kind, overrideParams) {
    if (!key) {
      setError({ code: 'MISSING' });
      return;
    }
    const more = kind === 'more';
    let p = overrideParams;
    if (!p) {
      if (more || kind === 'refresh') {
        p = lastQ.current;
      }
    }
    if (!p) {
      p = { kw: kw.trim(), cat: f.cat, region: f.region, period: f.period };
    }
    if (kind === 'new') {
      setApplied(p);
    }
    lastQ.current = p;

    setLoading(true);
    setError(null);
    if (!more) setItems([]);

    try {
      const cutoff = p.period > 0 ? Date.now() - p.period * 36e5 : 0;
      let vids = [], next = '';

      if (p.kw) {
        const searchParams = {
          part: 'snippet',
          type: 'video',
          q: p.kw,
          maxResults: 50,
          regionCode: p.region,
          order: 'viewCount',
          pageToken: more ? token : ''
        };
        if (p.cat) searchParams.videoCategoryId = p.cat;
        if (cutoff > 0) searchParams.publishedAfter = new Date(cutoff).toISOString();

        const s = await yt('search', searchParams, key);
        next = s.nextPageToken || '';
        const ids = (s.items || []).map(i => i.id && i.id.videoId).filter(Boolean);
        vids = ids.length ? ((await yt('videos', { part: 'snippet,statistics,contentDetails', id: ids.join(',') }, key)).items || []) : [];
      } else {
        const vidParams = {
          part: 'snippet,statistics,contentDetails',
          chart: 'mostPopular',
          regionCode: p.region,
          maxResults: 50,
          pageToken: more ? token : ''
        };
        if (p.cat) vidParams.videoCategoryId = p.cat;

        const s = await yt('videos', vidParams, key);
        next = s.nextPageToken || '';
        vids = (s.items || []).filter(i => cutoff === 0 || new Date(i.snippet.publishedAt).getTime() >= cutoff);
      }

      const cids = [...new Set(vids.map(v => v.snippet.channelId))];
      const subs = {};
      if (cids.length) {
        const c = await yt('channels', { part: 'statistics', id: cids.join(',') }, key);
        (c.items || []).forEach(x => {
          subs[x.id] = x.statistics.hiddenSubscriberCount ? null : Number(x.statistics.subscriberCount);
        });
      }

      const out = vids.map(v => {
        const s = v.statistics || {};
        const bestThumb = getBestThumb(v.snippet.thumbnails);
        const durSeconds = parseDur(v.contentDetails && v.contentDetails.duration);
        const o = {
          id: v.id,
          title: v.snippet.title,
          channel: v.snippet.channelTitle,
          channelId: v.snippet.channelId,
          thumb: bestThumb,
          published: v.snippet.publishedAt,
          ts: new Date(v.snippet.publishedAt).getTime(),
          views: Number(s.viewCount || 0),
          likes: s.likeCount == null ? null : Number(s.likeCount),
          comments: s.commentCount == null ? null : Number(s.commentCount),
          dur: durSeconds,
          subs: subs[v.snippet.channelId] === undefined ? null : subs[v.snippet.channelId]
        };
        const sc = score(o);
        o.sc = sc;
        o.total = sc.total;
        o.vph = sc.vph;
        o.eng = sc.eng;
        return o;
      });

      setItems(prev => more ? [...prev, ...out.filter(o => !prev.some(x => x.id === o.id))] : out);
      setToken(next);
      setLoaded(true);
    } catch (e) {
      setError(e);
    } finally {
      setLoading(false);
    }
  }

  // Load High-RPM Hidden Cash-Cow Channels
  async function loadRpm(nicheId, customPeriod, subOpt, durOpt, viewOpt, queryOverride) {
    if (!key) {
      setError({ code: 'MISSING' });
      return;
    }
    const targetPeriod = customPeriod !== undefined ? customPeriod : rpmPeriod;
    const targetSub = subOpt !== undefined ? subOpt : rpmSubFilter;
    const targetDur = durOpt !== undefined ? durOpt : rpmDurFilter;
    const targetView = viewOpt !== undefined ? viewOpt : rpmViewFilter;
    const targetQuery = queryOverride !== undefined ? queryOverride : rpmQuery;
    const niche = CASHCOW_NICHES.find(n => n.id === nicheId) || CASHCOW_NICHES[0];
    
    setRpmLoading(true);
    setError(null);
    setRpmItems([]);

    try {
      const cutoff = targetPeriod > 0 ? Date.now() - targetPeriod * 36e5 : 0;
      
      let q = targetQuery.trim();
      if (!q) {
        q = niche.queries.slice(0, 3).join(' | ');
      }

      const searchParams = {
        part: 'snippet',
        type: 'video',
        q: q,
        maxResults: 50,
        regionCode: 'US', // Target US high-paying audience
        order: 'viewCount'
      };

      if (targetDur === 'long') {
        searchParams.videoDuration = 'long'; // > 20 mins for Cash Cow videos
      }
      if (cutoff > 0) {
        searchParams.publishedAfter = new Date(cutoff).toISOString();
      }

      const s = await yt('search', searchParams, key);
      const ids = (s.items || []).map(i => i.id && i.id.videoId).filter(Boolean);
      const vids = ids.length ? ((await yt('videos', { part: 'snippet,statistics,contentDetails', id: ids.join(',') }, key)).items || []) : [];

      const cids = [...new Set(vids.map(v => v.snippet.channelId))];
      const subs = {};
      const channelStats = {};
      if (cids.length) {
        const c = await yt('channels', { part: 'statistics,snippet', id: cids.join(',') }, key);
        (c.items || []).forEach(x => {
          subs[x.id] = x.statistics.hiddenSubscriberCount ? null : Number(x.statistics.subscriberCount);
          channelStats[x.id] = {
            subCount: x.statistics.hiddenSubscriberCount ? null : Number(x.statistics.subscriberCount),
            videoCount: Number(x.statistics.videoCount || 0)
          };
        });
      }

      let out = vids.map(v => {
        const s = v.statistics || {};
        const bestThumb = getBestThumb(v.snippet.thumbnails);
        const durSeconds = parseDur(v.contentDetails && v.contentDetails.duration);
        const o = {
          id: v.id,
          title: v.snippet.title,
          channel: v.snippet.channelTitle,
          channelId: v.snippet.channelId,
          thumb: bestThumb,
          published: v.snippet.publishedAt,
          ts: new Date(v.snippet.publishedAt).getTime(),
          views: Number(s.viewCount || 0),
          likes: s.likeCount == null ? null : Number(s.likeCount),
          comments: s.commentCount == null ? null : Number(s.commentCount),
          dur: durSeconds,
          subs: subs[v.snippet.channelId] === undefined ? null : subs[v.snippet.channelId],
          videoCount: channelStats[v.snippet.channelId]?.videoCount || 0,
          niche: niche
        };
        const sc = score(o);
        o.sc = sc;
        o.total = sc.total;
        o.vph = sc.vph;
        o.eng = sc.eng;
        return o;
      });

      // Filter by Subscriber Limit
      if (targetSub === 'under30k') {
        out = out.filter(v => v.subs == null || v.subs <= 30000);
      } else if (targetSub === 'under50k') {
        out = out.filter(v => v.subs == null || v.subs <= 50000);
      } else if (targetSub === 'under100k') {
        out = out.filter(v => v.subs == null || v.subs <= 100000);
      }

      // Filter by Steady Views (1,000 - 60,000 views)
      if (targetView === 'steady') {
        out = out.filter(v => v.views >= 1000 && v.views <= 60000);
      }

      // Filter by Duration if requested
      if (targetDur === 'long') {
        out = out.filter(v => v.dur >= 1200); // >= 20 mins
      }

      out.sort((a, b) => b.views - a.views);

      setRpmItems(out);
    } catch (e) {
      setError(e);
    } finally {
      setRpmLoading(false);
    }
  }

  function applyPreset(preset) {
    setActivePreset(preset.id);
    const updated = {
      ...f,
      cat: preset.cat,
      period: preset.period,
      vtype: preset.vtype || 'all'
    };
    setF(updated);
    setApplied(updated);
    if (preset.sort) setSort(preset.sort);

    load('new', {
      kw: kw.trim(),
      cat: preset.cat,
      region: f.region,
      period: preset.period
    });
  }

  function handleFilterChange(field, val) {
    const updated = { ...f, [field]: val };
    setF(updated);
    setApplied(updated);
    load('new', {
      kw: kw.trim(),
      cat: updated.cat,
      region: updated.region,
      period: updated.period
    });

  function clearFilters() {
    setF(DEF);

    setKw('');

  const shown = useMemo(() => {
    const mv = Number(applied.minViews) || 0;
    return items
      .filter(v => v.views >= mv)
      .filter(v => {
        if (applied.vtype === 'all') return true;
        if (applied.vtype === 'short') return v.dur <= 60;
        if (applied.vtype === 'brief') return v.dur > 60 && v.dur <= 300;
        if (applied.vtype === 'medium') return v.dur > 300 && v.dur <= 1200;
        if (applied.vtype === 'long') return v.dur > 1200;
        return true;
      })
      .sort((a, b) => {
        if (sort === 'total') return b.total - a.total;
        if (sort === 'vph') return b.vph - a.vph;
        if (sort === 'views') return b.views - a.views;
        if (sort === 'ts') return b.ts - a.ts;
        if (sort === 'eng') return b.eng - a.eng;
        if (sort === 'dur') return b.dur - a.dur;
        return 0;
      });
  }, [items, applied, sort]);

  const stats = useMemo(() => {
    const n = shown.length;
    return {
      n,
      views: shown.reduce((a, v) => a + v.views, 0),
      avg: n ? shown.reduce((a, v) => a + v.total, 0) / n : 0,
      maxVph: n ? Math.max(...shown.map(v => v.vph)) : 0

  async function updateSnaps() {

    setBusy(true);
    setError(null);
    try {
      const cur = {};
      for (let i = 0; i < ids.length; i += 50) {
        const r = await yt('videos', { part: 'statistics', id: ids.slice(i, i + 50).join(',') }, key);
        (r.items || []).forEach(x => { cur[x.id] = Number(x.statistics.viewCount || 0); });
      }
      const t = Date.now();
      setWatch(w => {
        const n = { ...w };
        Object.keys(cur).forEach(id => {
          if (n[id]) n[id] = { ...n[id], snaps: [...n[id].snaps, { t, v: cur[id] }] };
        });
        return n;
      });
      showToast('Đã cập nhật snapshot mới nhất!');
    } catch (e) {
      setError(e);
    } finally {
      setBusy(false);

  }

  function exportCsv() {
    const esc = x => { const s = String(x == null ? '' : x); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const head = ['Tiêu đề', 'Kênh', 'Link', 'Ngày đăng', 'Lượt xem', 'Lượt thích', 'Bình luận', 'Subscribers', 'Views/Giờ', 'Trend Score'];
    const rows = shown.map(v => [v.title, v.channel, 'https://www.youtube.com/watch?v=' + v.id, fmtD(v.published), v.views, v.likes == null ? '' : v.likes, v.comments == null ? '' : v.comments, v.subs == null ? '' : v.subs, Math.round(v.vph), v.total]);
    const csv = '\uFEFF' + [head, ...rows].map(r => r.map(esc).join(',')).join('\r\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = 'youtrend-' + new Date().toISOString().slice(0, 10) + '.csv';

                        {/* Interactive Question & Choice Buttons */}
                        <div className="bg-brand-card p-3 rounded-xl border border-brand-border space-y-2">
                          <div className="text-xs font-bold text-amber-300 flex items-center justify-between">
                            <span>Bạn có muốn cập nhật thêm trend này không?</span>
                          </div>

                          <div className="grid grid-cols-2 gap-2">
                            <button
                              onClick={() => approveTrend(trend)}
                              className="py-2 px-3 rounded-xl text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white shadow-md transition flex items-center justify-center gap-1.5">
                              <span>✓ Đồng Ý Cập Nhật</span>
                            </button>

                            <button
                              onClick={() => copyRemakePrompt({ title: trend.title, channel: trend.channel, views: trend.views, dur: trend.dur, vph: trend.vph })}
                              className="py-2 px-3 rounded-xl text-xs font-bold bg-purple-600/30 hover:bg-purple-600/40 border border-purple-500/40 text-purple-200 transition flex items-center justify-center gap-1.5">
                              <span>📋 Lấy Kịch Bản AI</span>
                            </button>
                          </div>

                          <div className="flex gap-2 pt-1 border-t border-brand-border/60">
                            <a
                              href={ytUrl}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="flex-1 py-1 px-2 rounded-lg text-[11px] text-center font-semibold bg-red-600/80 hover:bg-red-600 text-white transition">
                              Xem trên YouTube ↗
                            </a>
                            <button
                              onClick={() => dismissTrend(trend.id)}
                              className="py-1 px-3 rounded-lg text-[11px] text-zinc-400 hover:text-white bg-brand-surface hover:bg-brand-card border border-brand-border transition">
                              Bỏ qua
                            </button>
                          </div>
                        </div>
                      </article>
                    );
                  })}
                </div>
              )}
            </div>

            {/* SECTION 2: APPROVED TRENDS (DANH MỤC TREND ĐÃ DUYỆT ĐANG KHAI THÁC) */}
            {autoUpdateData.approvedTrends?.length > 0 && (
              <div className="space-y-3 pt-3 border-t border-brand-border">
                <div className="flex items-center justify-between">
                  <h3 className="font-extrabold text-sm sm:text-base text-white flex items-center gap-2">
                    <span>Kho Trend Đã Duyệt Cập Nhật ({autoUpdateData.approvedTrends.length})</span>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                      Sẵn Sàng Làm Video
                    </span>
                  </h3>
                </div>

                <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
                  {autoUpdateData.approvedTrends.map(t => (
                    <div key={t.id} className="bg-brand-surface border border-brand-border rounded-xl p-3 space-y-2 flex flex-col justify-between shadow-md">
                      <div>
                        <div className="flex items-center justify-between text-[10px] text-zinc-400 mb-1">
                          <span className="font-bold text-emerald-400 uppercase">{t.nicheName}</span>
                          <span>RPM {t.rpm}</span>
                        </div>
                        <h4 className="font-bold text-xs text-white line-clamp-2 leading-snug">{t.title}</h4>
                        <div className="text-[11px] text-zinc-400 mt-1 flex justify-between">
                          <span>{t.channel}</span>
                          <span className="text-zinc-200 font-semibold">{fmt(t.views)} view</span>
                        </div>
                      </div>

                      <div className="flex flex-wrap gap-1.5 pt-2 border-t border-brand-border">
                        <button
                          onClick={() => copyRemakePrompt({ title: t.title, channel: t.channel, views: t.views, dur: t.dur, vph: t.vph })}
                          className="flex-1 py-1.5 px-2 rounded-lg text-xs font-semibold bg-purple-600/30 hover:bg-purple-600/40 text-purple-200 border border-purple-500/40 transition text-center">
                          Copy Prompt AI
                        </button>
                        <a
                          href={t.videoId && !t.videoId.startsWith('sample') ? `https://www.youtube.com/watch?v=${t.videoId}` : `https://www.youtube.com/results?search_query=${encodeURIComponent(t.title)}`}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="py-1.5 px-2.5 rounded-lg text-xs font-semibold bg-red-600 hover:bg-red-500 text-white transition">
                          YouTube ↗
                        </a>
                        <button
                          onClick={() => removeApprovedTrend(t.id)}
                          className="py-1.5 px-2 rounded-lg text-xs text-zinc-400 hover:text-red-400 bg-brand-card hover:bg-brand-hover border border-brand-border transition"
                          title="Xóa khỏi danh mục">
                          ✕
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* SECTION 3: SCAN HISTORY LOGS */}
            <div className="bg-brand-surface border border-brand-border rounded-xl p-4 space-y-3">
              <h4 className="font-bold text-xs uppercase tracking-wider text-zinc-300">
                Lịch Sử Quét Tự Động Hàng Ngày
              </h4>
              <div className="divide-y divide-brand-border/60 text-xs">
                {(autoUpdateData.history || []).map((h, i) => (
                  <div key={i} className="py-2 flex flex-col sm:flex-row sm:items-center justify-between gap-1 text-zinc-400">
                    <div className="flex items-center gap-2">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                      <span className="font-medium text-zinc-300">{h.status}</span>
                    </div>
                    <span className="text-[11px] text-zinc-500">{h.time}</span>
                  </div>
                ))}
              </div>
            </div>
          </section>
        )}

        {/* TAB 4: WATCHLIST CONTENT */}
        {tab === 'watch' && (
          <section className="space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3 p-4 bg-brand-surface border border-brand-border rounded-xl">
              <div>
                <h2 className="font-bold text-base text-white">Danh sách theo dõi tăng trưởng (Snapshot)</h2>
                <p className="text-xs text-zinc-400">Ghi nhận sự tăng trưởng lượt xem thực tế theo từng thời điểm để phân tích tốc độ tăng view.</p>
              </div>
              <button onClick={updateSnaps} disabled={busy || !watchList.length} className={bPrimary + ' disabled:opacity-40'}>
                {busy ? 'Đang quét snapshot...' : 'Cập nhật lượt xem mới'}
              </button>
            </div>

            {!watchList.length && (
              <div className="text-center border border-dashed border-brand-border rounded-xl p-10 bg-brand-surface/40">
                <h3 className="font-bold text-base text-white">Chưa có video nào trong Watchlist</h3>
                <p className="text-xs sm:text-sm text-zinc-400 mt-1 max-w-sm mx-auto">
                  Tại tab "Tìm xu hướng" hoặc "Trend RPM Cao", bấm nút <b>Theo dõi</b> ở bất kỳ video nào bạn muốn lưu.
                </p>
              </div>
            )}

            <div className="grid md:grid-cols-2 gap-4">
              {watchList.map(w => {
                const first = w.snaps[0], last = w.snaps[w.snaps.length - 1];
                const gain = last.v - first.v;
                const hrs = (last.t - first.t) / 36e5;
                const ytUrl = 'https://www.youtube.com/watch?v=' + w.id;
                return (
                  <article key={w.id} className="bg-brand-surface border border-brand-border rounded-xl p-4 flex flex-col sm:flex-row gap-3">
                    <img src={w.thumb} alt="" className="w-full sm:w-36 aspect-video object-cover rounded-xl bg-zinc-900 flex-shrink-0" />
                    <div className="flex-1 space-y-2 text-xs">
                      <h3 className="font-bold text-sm text-white line-clamp-2 leading-snug">{w.title}</h3>
                      <div className="text-zinc-400">{w.channel} · Đăng {fmtD(w.published)}</div>
                      <div className="bg-brand-card p-2.5 rounded-lg border border-brand-border space-y-1">
                        <div>View hiện tại: <b className="text-white text-sm">{fmt(last.v)}</b> · Snapshot: <b>{w.snaps.length} lần</b></div>
                        {w.snaps.length < 2 ? (
                          <div className="text-amber-400 text-[11px]">Cần ít nhất 2 lần bấm "Cập nhật" sau ít phút để đo tốc độ tăng.</div>
                        ) : (
                          <div className="text-emerald-400 font-semibold text-[11px]">
                            Tăng thêm: +{fmt(gain)} view trong {hrs.toFixed(2)} giờ ({hrs > 0 ? fmt(gain / hrs) : 'N/A'} view/giờ thực tế)
                          </div>
                        )}
                      </div>
                      <div className="flex flex-wrap gap-1.5 pt-1">
                        <a href={ytUrl} target="_blank" rel="noopener noreferrer" className="px-3 py-1.5 rounded-lg font-semibold bg-red-600 hover:bg-red-500 text-white transition flex items-center">
                          Xem trên YouTube
                        </a>
                        <button onClick={() => setDownloadVideo(w)} className="px-3 py-1.5 rounded-lg font-medium bg-emerald-600/20 text-emerald-300 border border-emerald-500/30">
                          Tải về
                        </button>
                        <button onClick={() => setWatch(x => { const n = { ...x }; delete n[w.id]; return n; })} className="px-3 py-1.5 rounded-lg text-zinc-400 hover:text-red-400 bg-brand-card hover:bg-brand-hover border border-brand-border">
                          Bỏ theo dõi
                        </button>
                      </div>
                    </div>
                  </article>
                );
              })}
            </div>
          </section>
        )}
      </main>

      {/* Footer */}
      <footer className="border-t border-brand-border py-4 text-center text-xs text-zinc-500 bg-brand-surface/40">
        YouTrend Analytics · Dữ liệu chính thống từ YouTube Data API v3.
      </footer>

      {/* API Key Configuration Modal */}
      {showKeyBox && (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowKeyBox(false)}>
          <div className="bg-brand-surface border border-brand-border rounded-xl p-6 w-full max-w-md space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between border-b border-brand-border pb-3">
              <h2 className="font-bold text-base text-white">Cấu hình YouTube API Key</h2>
              <button onClick={() => setShowKeyBox(false)} className="text-zinc-400 hover:text-white">✕</button>
            </div>
            <div className="space-y-2">
              <label className="text-xs text-zinc-300 font-semibold">Dán Google API Key (bắt đầu bằng AIza...):</label>
              <input 
                className={inp} 
                type={showKey ? 'text' : 'password'} 
                placeholder="AIzaSy..." 
                value={keyDraft} 
                onChange={e => setKeyDraft(e.target.value)} 
              />
              <div className="flex items-center justify-between text-xs text-zinc-400">
                <label className="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" checked={showKey} onChange={e => setShowKey(e.target.checked)} className="rounded bg-brand-card" />
                  Hiện ký tự key
                </label>
                <a href="https://console.cloud.google.com/apis/credentials" target="_blank" rel="noreferrer" className="text-red-400 hover:underline">
                  Lấy key ở đâu?
                </a>
              </div>
            </div>
            <div className="text-[11px] text-zinc-400 bg-brand-card p-3 rounded-lg border border-brand-border">
              Key chỉ lưu duy nhất trong bộ nhớ trình duyệt của bạn (localStorage), không gửi ra ngoài.
            </div>
            <div className="flex gap-2 justify-end pt-2">
              {key && <button onClick={removeKey} className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-red-950 text-red-400 hover:bg-red-900 border border-red-800 transition">Xóa key</button>}
              <button onClick={() => setShowKeyBox(false)} className={bSecondary}>Đóng</button>
              <button onClick={saveKey} className={bPrimary}>Lưu API Key</button>
            </div>
          </div>
        </div>
      )}

      {/* Analytics Breakdown Modal */}
      {detail && (() => {
        const v = detail, s = v.sc;
        const ytUrl = 'https://www.youtube.com/watch?v=' + v.id;
        const rows = [
          ['Tốc độ xem ước lượng (Speed)', s.speed, 40, fmt(s.vph) + ' view/giờ. Đánh giá tốc độ gia tăng lượt xem so với thời gian phát hành.'],
          ['Độ mới (Freshness)', s.fresh, 20, 'Video đăng cách đây ' + s.hours.toFixed(1) + ' giờ. Càng mới điểm càng cao.'],
          ['Tỷ lệ tương tác (Engagement)', s.eng, 20, 'Tương tác (Like + Bình luận)/View = ' + s.engPercent + '%. Video có tương tác cao hơn dễ viral.'],
          ['Hiệu suất so với kênh (Relative)', s.rel, 20, s.ratio == null ? 'Kênh ẩn số subscribers.' : 'Lượt xem gấp ' + s.ratio.toFixed(2) + ' lần lượng sub của kênh (Tín hiệu bứt phá khỏi tệp fan cũ).']
        ];
        return (
          <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-start justify-center p-4 overflow-y-auto" onClick={() => setDetail(null)}>
            <div className="bg-brand-surface border border-brand-border rounded-xl p-6 w-full max-w-2xl space-y-5 my-8 shadow-2xl" onClick={e => e.stopPropagation()}>
              <div className="flex gap-3 items-start justify-between border-b border-brand-border pb-4">
                <div className="flex gap-3">
                  <img src={v.thumb} alt="" className="w-28 sm:w-36 aspect-video object-cover rounded-xl bg-zinc-900" />
                  <div>
                    <h2 className="font-bold text-sm sm:text-base text-white line-clamp-2 leading-snug">{v.title}</h2>
                    <div className="text-xs text-zinc-400 mt-1">{v.channel} · {fmtD(v.published)}</div>
                  </div>
                </div>
                <button onClick={() => setDetail(null)} className="w-8 h-8 rounded-lg bg-brand-card hover:bg-brand-hover text-zinc-400 hover:text-white flex items-center justify-center">✕</button>
              </div>

              {/* Stats Grid */}
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs">
                {[
                  ['Lượt xem', fmt(v.views)],
                  ['Lượt thích', fmt(v.likes)],
                  ['Bình luận', fmt(v.comments)],
                  ['Subscribers kênh', fmt(v.subs)],
                  ['Thời lượng', fmtDur(v.dur)],
                  ['Tốc độ VPH', fmt(s.vph) + ' / giờ']
                ].map(x => (
                  <div key={x[0]} className="bg-brand-card rounded-lg p-2.5 border border-brand-border">
                    <div className="text-zinc-400 text-[11px]">{x[0]}</div>
                    <div className="font-bold text-sm text-white mt-0.5">{x[1]}</div>
                  </div>
                ))}
              </div>

              {/* Trend Score Factors */}
              <div>
                <div className="flex items-center justify-between mb-3">
                  <h3 className="font-bold text-sm text-white">Chỉ số Trend Score chi tiết</h3>
                  <span className={`px-2.5 py-1 rounded-lg font-bold text-sm ${scoreCls(s.total)}`}>{s.total} / 100</span>
                </div>
                <div className="space-y-3 bg-brand-card p-4 rounded-xl border border-brand-border">
                  {rows.map(r => (
                    <div key={r[0]}>
                      <div className="flex justify-between text-xs text-zinc-300 font-semibold">
                        <span>{r[0]}</span>
                        <b className="text-white">{r[1].toFixed(1)} / {r[2]}</b>
                      </div>
                      <div className="h-1.5 bg-brand-border rounded-full mt-1.5 overflow-hidden">
                        <div className="h-full bg-red-600 rounded-full" style={{ width: (r[1] / r[2] * 100) + '%' }}></div>
                      </div>
                      <div className="text-[11px] text-zinc-400 mt-1">{r[3]}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="flex flex-wrap gap-2 pt-2 border-t border-brand-border justify-end">
                <a href={ytUrl} target="_blank" rel="noopener noreferrer" className={bPrimary}>
                  Xem trên YouTube
                </a>
                <button onClick={() => { setDetail(null); setDownloadVideo(v); }} className={bSecondary}>
                  Tải video & MP3
                </button>
              </div>
            </div>
          </div>
        );
      })()}

      {/* Download Video Modal */}
      {downloadVideo && (
        <DownloadModal video={downloadVideo} onClose={() => setDownloadVideo(null)} onCopy={copyText} />
      )}

      {/* Cash Cow Channel Spy Breakdown Modal */}
      {explainVideo && (
        <CashCowExplainModal 
          video={explainVideo} 
          onClose={() => setExplainVideo(null)} 
          onDownload={setDownloadVideo}
          onPromptCopy={copyRemakePrompt}
          onThumbCopy={copyThumbPrompt}
        />
      )}

      {/* Trending Keyword Detail Modal (Strictly No Icons) */}
      {selectedKeyword && (
        <KeywordDetailModal
          item={selectedKeyword}
          onClose={() => setSelectedKeyword(null)}
          onSearchVideo={handleExploreKeywordVideos}
          onCopy={copyText}
        />
      )}

      {/* Security F12 Blocked Warning Modal */}
      {showF12Blocked && (
        <F12BlockedModal onClose={() => setShowF12Blocked(false)} />
      )}

      {/* Niche Deep Saturation & Competitor Analysis Modal */}
      {nicheAnalyzeVideo && (
        <NicheDeepAnalyzeModal
          video={nicheAnalyzeVideo}
          onClose={() => setNicheAnalyzeVideo(null)}
          apiKey={key}
          onAddCompetitor={addCompetitorFromVideo}
          onCopy={copyText}
          showToast={showToast}
        />
      )}

      {/* Competitor Content Breakdown & Prompt Cloner Modal */}
      {selectedCompVideoForPrompt && (
        <CompetitorContentPromptModal
          video={selectedCompVideoForPrompt}
          onClose={() => setSelectedCompVideoForPrompt(null)}
          onCopy={copyText}
        />
      )}

      {/* User Account & API Key Management Modal */}
      {showAccountModal && (
        <AccountProfileModal
          apiKey={key}
          onClose={() => setShowAccountModal(false)}
          onSaveKey={(k) => {
            const trimmed = k.trim();
            setKey(trimmed);
            st.set('yt_key', trimmed);
            setShowAccountModal(false);
            showToast('Đã kích hoạt tài khoản thành công!');
          }}
          onRemoveKey={() => {
            setKey('');
            st.set('yt_key', '');
            setShowAccountModal(false);
            showToast('Đã đăng xuất tài khoản.');
          }}
          competitorsCount={competitors.length}
          watchCount={watchList.length}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

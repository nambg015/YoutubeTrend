// 1. WIKI READER MODAL (FAST-READ 1-MINUTE KNOWLEDGE VIEW)
function WikiReaderModal({ article, onClose, onSelectArticle, isRead, onToggleRead, allArticles }) {
  if (!article) return null;
  const [showAnswer, setShowAnswer] = React.useState(false);
  const [copiedFormula, setCopiedFormula] = React.useState(false);
  const [copiedSummary, setCopiedSummary] = React.useState(false);

  // Reset showAnswer state whenever article changes
  React.useEffect(() => {
    setShowAnswer(false);
  }, [article.id]);

  const currentIndex = (allArticles || []).findIndex(a => a.id === article.id);
  const prevArticle = currentIndex > 0 ? allArticles[currentIndex - 1] : null;
  const nextArticle = currentIndex >= 0 && currentIndex < (allArticles || []).length - 1 ? allArticles[currentIndex + 1] : null;

  const categories = (typeof window !== 'undefined' && window.WIKI_CATEGORIES) ? window.WIKI_CATEGORIES : [];
  const currentCat = categories.find(c => c.id === article.category);
  const categoryName = currentCat ? currentCat.name : (article.categoryName || article.category || 'Kiến thức');
  const categoryIcon = currentCat ? currentCat.icon : '📖';

  const copyFormula = () => {
    if (article.formula && navigator.clipboard) {
      navigator.clipboard.writeText(article.formula);
      setCopiedFormula(true);
      setTimeout(() => setCopiedFormula(false), 2000);
    }
  };

  const copySummary = () => {
    if (navigator.clipboard) {
      const text = `[${article.title}]\n${article.summary || ''}${article.formula ? '\nCông thức: ' + article.formula : ''}`;
      navigator.clipboard.writeText(text);
      setCopiedSummary(true);
      setTimeout(() => setCopiedSummary(false), 2000);
    }
  };

  // Content resolvers for both new simplified schema and legacy schema
  const simpleText = article.simple || article.simpleExplanation || article.whatIs || '';
  const exampleText = article.example || article.realWorldExample || '';
  const howToText = article.howTo || article.stepByStep || article.practicalUsage || '';
  const mistakeText = article.mistake || article.commonMistakes || '';
  const whyCareText = article.whyCare || '';
  const misconceptionsText = article.misconceptions || '';
  const exerciseText = article.exercise || '';

  // Parse exercise into question & answer if formatted with "Đáp án:"
  const hasExerciseAnswer = exerciseText.includes('Đáp án:');
  const questionPart = hasExerciseAnswer ? exerciseText.split('Đáp án:')[0].trim() : exerciseText;
  const answerPart = hasExerciseAnswer ? exerciseText.split('Đáp án:')[1].trim() : '';

  const relatedList = (article.relatedConcepts || []).map(id => {
    return (allArticles || []).find(a => a.id === id);
  }).filter(Boolean);

  // Dynamic quick-navigation items
  const navItems = [
    { id: 'w-summary', title: 'Tóm tắt', icon: '⚡' },
    simpleText ? { id: 'w-simple', title: 'Hiểu nôm na', icon: '💡' } : null,
    exampleText ? { id: 'w-example', title: 'Ví dụ thực tế', icon: '🎯' } : null,
    howToText ? { id: 'w-howto', title: 'Cách làm YouTrend', icon: '🛠️' } : null,
    mistakeText ? { id: 'w-mistake', title: 'Sai lầm tránh', icon: '⚠️' } : null,
    exerciseText ? { id: 'w-exercise', title: 'Bài tập', icon: '📝' } : null
  ].filter(Boolean);

  const scrollTo = (id) => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };

  return (
    <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-2 sm:p-4" onClick={onClose}>
      <div 
        className="bg-brand-surface border border-brand-border rounded-2xl w-full max-w-4xl max-h-[92vh] flex flex-col shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-200"
        onClick={e => e.stopPropagation()}>
        
        {/* Header */}
        <div className="p-4 sm:p-5 border-b border-brand-border bg-brand-card/80 flex items-center justify-between gap-3 shrink-0">
          <div className="flex items-center gap-3 min-w-0">
            <span className="text-2xl sm:text-3xl shrink-0">{categoryIcon}</span>
            <div className="min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">
                  {categoryName}
                </span>
                <span className="text-[10px] text-zinc-400 border border-zinc-700 px-2 py-0.5 rounded">
                  {article.level || 'Cơ bản'} · Đọc ~{article.readTime || '1 phút'}
                </span>
                {isRead && (
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 flex items-center gap-1">
                    ✓ Đã học xong
                  </span>
                )}
              </div>
              <h1 className="text-base sm:text-lg font-black text-white mt-1 truncate">
                {article.title}

            </div>
          </div>
          <div className="flex items-center gap-2 shrink-0">
            <button
              onClick={() => onToggleRead(article.id)}
              className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 border ${

              title="Đánh dấu đã đọc bài này">

            {article.formula && (
              <div className="mt-2 pt-2 border-t border-amber-500/20 flex flex-col sm:flex-row sm:items-center justify-between gap-2 bg-black/30 p-2.5 rounded-lg">
                <div className="font-mono text-xs text-amber-200 font-bold">
                  {article.formula}
                </div>
                <button
                  onClick={copyFormula}
                  className="px-2.5 py-1 rounded bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 text-[10px] font-bold self-start sm:self-auto transition">
                  {copiedFormula ? '✓ Đã sao chép' : 'Copy công thức'}
                </button>
              </div>
            )}
          </div>

          {/* Section: Bản chất đời thường / Hiểu nôm na */}
          {simpleText && (
            <div id="w-simple" className="space-y-2">
              <h2 className="text-xs sm:text-sm font-bold text-amber-300 flex items-center gap-2 border-b border-brand-border/60 pb-1.5">
                <span>💡 Bản chất đời thường (Cách hiểu nôm na, dễ nhớ)</span>
              </h2>
              <div className="bg-amber-500/5 border border-amber-500/20 rounded-xl p-4 text-zinc-200 leading-relaxed whitespace-pre-line">
                {simpleText}
              </div>
            </div>
          )}

          {/* Section: Tại sao cần quan tâm (if legacy field exists) */}
          {whyCareText && (
            <div className="space-y-2">
              <h2 className="text-xs sm:text-sm font-bold text-zinc-200 flex items-center gap-2 border-b border-brand-border/60 pb-1.5">
                <span>🎯 Tại sao bạn cần quan tâm?</span>
              </h2>
              <p className="text-zinc-300 leading-relaxed whitespace-pre-line pl-1">
                {whyCareText}
              </p>
            </div>
          )}

          {/* Section: Ví dụ thực tế */}
          {exampleText && (
            <div id="w-example" className="space-y-2">
              <h2 className="text-xs sm:text-sm font-bold text-emerald-300 flex items-center gap-2 border-b border-brand-border/60 pb-1.5">
                <span>🎯 Ví dụ thực tế minh họa</span>
              </h2>
              <div className="bg-emerald-950/20 border border-emerald-500/30 rounded-xl p-4 text-zinc-200 leading-relaxed whitespace-pre-line">
                {exampleText}
              </div>
            </div>
          )}

          {/* Section: Cách làm trên YouTrend */}
          {howToText && (
            <div id="w-howto" className="space-y-2">
              <h2 className="text-xs sm:text-sm font-bold text-sky-300 flex items-center gap-2 border-b border-brand-border/60 pb-1.5">
                <span>🛠️ Các bước thực hành trực tiếp trên YouTrend</span>
              </h2>
              <div className="bg-brand-card/60 border border-brand-border rounded-xl p-4 text-zinc-200 font-mono text-xs whitespace-pre-line leading-relaxed">
                {howToText}
              </div>
            </div>
          )}

          {/* Section: Sai lầm cần tránh */}
          {mistakeText && (
            <div id="w-mistake" className="space-y-2">
              <h2 className="text-xs sm:text-sm font-bold text-rose-300 flex items-center gap-2 border-b border-brand-border/60 pb-1.5">
                <span>⚠️ Sai lầm người mới hay mắc phải</span>
              </h2>
              <div className="bg-rose-950/25 border border-rose-500/30 rounded-xl p-4 text-zinc-200 leading-relaxed whitespace-pre-line">
                {mistakeText}
              </div>
            </div>
          )}

          {/* Section: Tránh hiểu sai (if legacy exists) */}
          {misconceptionsText && (
            <div className="space-y-2">
              <h2 className="text-xs sm:text-sm font-bold text-blue-300 flex items-center gap-2 border-b border-brand-border/60 pb-1.5">
                <span>🛡️ Cách tránh hiểu sai dữ liệu</span>
              </h2>
              <div className="bg-blue-950/20 border border-blue-500/30 rounded-xl p-4 text-zinc-200 leading-relaxed whitespace-pre-line">
                {misconceptionsText}
              </div>
            </div>
          )}

          {/* Section: Khái niệm liên quan (if any) */}
          {relatedList.length > 0 && (
            <div className="space-y-2">
              <h2 className="text-xs sm:text-sm font-bold text-zinc-200 flex items-center gap-2 border-b border-brand-border/60 pb-1.5">
                <span>🔗 Khái niệm liên quan nên đọc tiếp</span>
              </h2>
              <div className="grid sm:grid-cols-2 gap-2.5 pt-1">
                {relatedList.map(rel => (
                  <button
                    key={rel.id}
                    onClick={() => onSelectArticle(rel)}
                    className="p-3 rounded-xl bg-brand-card hover:bg-zinc-800 border border-brand-border hover:border-amber-400/40 text-left transition group">
                    <div className="text-xs font-bold text-zinc-200 group-hover:text-amber-300 flex items-center justify-between">
                      <span>{rel.title}</span>
                      <span className="text-zinc-500 group-hover:translate-x-0.5 transition">→</span>
                    </div>
                    <div className="text-[11px] text-zinc-400 line-clamp-1 mt-1">
                      {rel.summary}
                    </div>
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* Section: Bài tập thực hành & tự kiểm tra */}
          {exerciseText && (
            <div id="w-exercise" className="space-y-3 bg-amber-500/5 border border-amber-500/30 rounded-xl p-4">
              <div className="flex items-center justify-between flex-wrap gap-2">
                <h2 className="text-xs sm:text-sm font-bold text-amber-300 flex items-center gap-1.5">
                  <span>📝 Bài tập thực hành kiểm tra hiểu biết</span>
                </h2>
                {hasExerciseAnswer && (
                  <button
                    onClick={() => setShowAnswer(!showAnswer)}
                    className="px-2.5 py-1 rounded-lg text-[10px] font-bold bg-amber-500/20 hover:bg-amber-500/30 text-amber-200 border border-amber-500/40 transition">
                    {showAnswer ? 'Ẩn đáp án' : 'Xem đáp án đối chiếu'}
                  </button>
                )}
              </div>
              <div className="text-zinc-200 text-xs sm:text-sm leading-relaxed whitespace-pre-line pl-1">
                {hasExerciseAnswer ? questionPart : exerciseText}
              </div>
              {hasExerciseAnswer && showAnswer && (
                <div className="mt-2.5 pt-2.5 border-t border-amber-500/30 bg-black/40 rounded-lg p-3 text-emerald-300 text-xs sm:text-sm leading-relaxed animate-in fade-in duration-200">
                  <div className="font-bold text-emerald-400 mb-1 flex items-center gap-1">
                    <span>✓ Đáp án & Giải thích:</span>
                  </div>
                  <div className="text-zinc-200 whitespace-pre-line">
                    {answerPart}
                  </div>
                </div>
              )}
              {hasExerciseAnswer && !showAnswer && (
                <div className="text-[11px] text-zinc-500 italic">
                  * Hãy tự suy nghĩ câu trả lời trước, sau đó bấm "Xem đáp án đối chiếu" để kiểm tra mức độ hiểu bài.
                </div>
              )}
            </div>
          )}
        </div>

        {/* Footer Navigation */}
        <div className="p-3 sm:p-4 bg-brand-card/90 border-t border-brand-border flex items-center justify-between gap-3 shrink-0 text-xs">
          {prevArticle ? (
            <button
              onClick={() => onSelectArticle(prevArticle)}
              className="px-3 py-1.5 rounded-xl bg-brand-surface hover:bg-zinc-800 text-zinc-300 hover:text-white border border-brand-border transition flex items-center gap-1.5">
              <span>←</span>
              <span className="hidden sm:inline">Bài trước:</span>
              <span className="font-semibold truncate max-w-[140px]">{prevArticle.title}</span>
            </button>
          ) : <div />}

          <div className="text-zinc-500 text-[11px]">
            Bài {(currentIndex + 1)} / {(allArticles || []).length}
          </div>

          {nextArticle ? (
            <button
              onClick={() => onSelectArticle(nextArticle)}
              className="px-3 py-1.5 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 text-amber-300 border border-amber-500/30 font-semibold transition flex items-center gap-1.5">
              <span className="hidden sm:inline">Bài tiếp theo:</span>
              <span className="truncate max-w-[140px]">{nextArticle.title}</span>
              <span>→</span>
            </button>
          ) : (
            <button
              onClick={onClose}
              className="px-4 py-1.5 rounded-xl bg-zinc-200 hover:bg-white text-zinc-950 font-bold transition">
              Hoàn thành đọc
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// 2. WIKI FULL TAB SECTION
function WikiSection({ onOpenArticle, readArticles, onToggleRead, onOpenDemandValidation, onOpenTitlePattern, onOpenIdeaPlanner }) {
  const [search, setSearch] = React.useState('');
  const [selectedCat, setSelectedCat] = React.useState('all');

  const categories = (typeof window !== 'undefined' && window.WIKI_CATEGORIES) ? window.WIKI_CATEGORIES : [];
  const articles = (typeof window !== 'undefined' && window.WIKI_ARTICLES) ? window.WIKI_ARTICLES : [];

  const beginnerIds = ['trend_def', 'niche_def', 'performance_multiple', 'first_10_videos'];
  const beginnerArticles = articles.filter(a => beginnerIds.includes(a.id));

  const filtered = articles.filter(a => {
    const matchCat = selectedCat === 'all' || a.category === selectedCat;
    if (!matchCat) return false;
    if (!search.trim()) return true;
    const q = search.toLowerCase();
    const titleMatch = (a.title || '').toLowerCase().includes(q);
    const summaryMatch = (a.summary || '').toLowerCase().includes(q);
    const simpleMatch = (a.simple || a.simpleExplanation || a.whatIs || '').toLowerCase().includes(q);
    const exampleMatch = (a.example || a.realWorldExample || '').toLowerCase().includes(q);
    const formulaMatch = a.formula ? a.formula.toLowerCase().includes(q) : false;
    return titleMatch || summaryMatch || simpleMatch || exampleMatch || formulaMatch;
  });

  const readCount = articles.filter(a => readArticles && readArticles[a.id]).length;
  const progressPct = Math.round((readCount / Math.max(1, articles.length)) * 100);

  return (
    <div className="space-y-6">
      {/* Header Banner */}
      <div className="bg-gradient-to-r from-amber-950/40 via-brand-surface to-brand-card border border-amber-500/30 rounded-2xl p-5 sm:p-7 shadow-xl">
        <div className="flex flex-col md:flex-row md:items-center justify-between gap-5">
          <div className="space-y-2 max-w-2xl">
            <div className="flex items-center gap-2">
              <span className="px-2.5 py-0.5 rounded-md bg-amber-500/20 text-amber-300 border border-amber-500/30 text-[10px] font-black uppercase tracking-wider">
                Trung Tâm Kiến Thức YouTube
              </span>
              <span className="text-zinc-500 text-xs">24 Chuyên Đề Cốt Lõi · Đọc 1 Phút</span>
            </div>
            <h1 className="text-xl sm:text-2xl font-black text-white">
              Wiki YouTubeTrend
            </h1>
            <p className="text-xs sm:text-sm text-zinc-300 leading-relaxed">
              Cẩm nang thuật ngữ & phương pháp nghiên cứu ngách YouTube siêu dễ hiểu. Giúp bạn nắm vững các chỉ số <b className="text-amber-400">Performance Multiple</b>, <b className="text-amber-400">Median Views</b>, <b className="text-amber-400">Title Patterns</b> và kiểm chứng nhu cầu thị trường trước khi sản xuất video.
            </p>
          </div>

          {/* Reading Progress Card */}
          <div className="bg-brand-surface/90 border border-brand-border rounded-xl p-4 min-w-[240px] shrink-0 space-y-2.5">
            <div className="flex items-center justify-between text-xs">
              <span className="text-zinc-400 font-medium">Tiến độ hoàn thành:</span>
              <span className="font-bold text-amber-400">{readCount} / {articles.length} bài ({progressPct}%)</span>
            </div>
            <div className="w-full h-2 rounded-full bg-zinc-800 overflow-hidden">
              <div 
                className="h-full bg-gradient-to-r from-amber-500 to-emerald-400 rounded-full transition-all duration-500" 
                style={{ width: `${progressPct}%` }}
              />
            </div>
            <div className="text-[11px] text-zinc-500 flex items-center justify-between">
              <span>{readCount === articles.length ? '🎉 Đã làm chủ toàn bộ!' : 'Hãy đọc ít nhất 4 bài cốt lõi'}</span>
            </div>
          </div>
        </div>

        {/* Search & Filter Controls */}
        <div className="mt-5 pt-5 border-t border-brand-border/60 flex flex-col sm:flex-row gap-3">
          <div className="relative flex-1">
            <input
              type="text"
              value={search}
              onChange={e => setSearch(e.target.value)}
              placeholder="Tìm kiếm bài viết theo từ khóa (vd: Performance Multiple, Median, Title Pattern, Ngách...)"
              className="w-full bg-brand-card border border-brand-border rounded-xl px-4 py-2.5 text-xs sm:text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-amber-500 transition"
            />
            {search && (
              <button
                onClick={() => setSearch('')}
                className="absolute right-3 top-2.5 text-zinc-400 hover:text-white text-xs">
                ✕
              </button>
            )}
          </div>
          {search && (
            <div className="text-xs text-zinc-400 self-center">
              Tìm thấy <b className="text-amber-400">{filtered.length}</b> bài viết
            </div>
          )}
        </div>
      </div>

      {/* 3 Practical Research Tools Bar inside Wiki */}
      <div className="bg-gradient-to-r from-zinc-900/90 via-brand-surface to-brand-card border border-brand-border rounded-2xl p-4 sm:p-5 flex flex-col md:flex-row md:items-center justify-between gap-4 shadow-lg">
        <div className="space-y-1 max-w-xl">
          <div className="flex items-center gap-2">
            <span className="text-base">🛠️</span>
            <span className="text-xs sm:text-sm font-bold text-white">Bộ 3 Công Cụ Thực Chiến Nghiên Cứu Ngách</span>
            <span className="text-[10px] bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded border border-zinc-700">Thực hành</span>
          </div>
          <p className="text-[11px] sm:text-xs text-zinc-400 leading-relaxed">
            Áp dụng kiến thức Wiki vào thực tế: Kiểm chứng nhu cầu thị trường, phân tích khuôn tiêu đề viral và lên bảng kế hoạch 10-20 video đầu tiên.
          </p>
        </div>
        <div className="flex flex-wrap items-center gap-2.5 shrink-0">
          <button
            type="button"
            onClick={onOpenDemandValidation}
            className="px-3.5 py-2 rounded-xl text-xs font-bold bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300 border border-emerald-500/35 transition flex items-center gap-1.5 shadow-sm hover:shadow-emerald-500/10 hover:border-emerald-400/50">
            <span>🧪</span>
            <span>Kiểm Chứng Nhu Cầu</span>
          </button>
          <button
            type="button"
            onClick={onOpenTitlePattern}
            className="px-3.5 py-2 rounded-xl text-xs font-bold bg-purple-500/15 hover:bg-purple-500/25 text-purple-300 border border-purple-500/35 transition flex items-center gap-1.5 shadow-sm hover:shadow-purple-500/10 hover:border-purple-400/50">
            <span>🎯</span>
            <span>Khuôn Tiêu Đề</span>
          </button>
          <button
            type="button"
            onClick={onOpenIdeaPlanner}
            className="px-3.5 py-2 rounded-xl text-xs font-bold bg-amber-500/15 hover:bg-amber-500/25 text-amber-300 border border-amber-500/35 transition flex items-center gap-1.5 shadow-sm hover:shadow-amber-500/10 hover:border-amber-400/50">
            <span>📋</span>
            <span>Kế Hoạch Video</span>
          </button>
        </div>
      </div>

      {/* Recommended for Beginners (Only if no search) */}
      {!search.trim() && selectedCat === 'all' && (
        <div className="space-y-3">
          <div className="flex items-center justify-between">
            <h2 className="text-xs sm:text-sm font-bold text-zinc-200 flex items-center gap-2">
              <span>🌱 Đề Xuất Cho Người Mới Bắt Đầu (Bắt Buộc Phải Đọc)</span>
            </h2>
            <span className="text-[11px] text-zinc-500">4 bài nền tảng giúp tránh mất tiền & công sức</span>
          </div>
          <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
            {beginnerArticles.map(a => {
              const isRead = readArticles && !!readArticles[a.id];
              return (
                <div
                  key={a.id}
                  onClick={() => onOpenArticle(a)}
                  className="bg-brand-surface border border-brand-border hover:border-amber-500/50 rounded-xl p-3.5 flex flex-col justify-between cursor-pointer group transition duration-200 hover:shadow-lg hover:shadow-amber-500/5">
                  <div className="space-y-1.5">
                    <div className="flex items-center justify-between">
                      <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-300 border border-amber-500/20">
                        {a.level}
                      </span>
                      {isRead && <span className="text-emerald-400 text-xs font-bold">✓ Đã đọc</span>}
                    </div>
                    <h3 className="text-xs font-bold text-white group-hover:text-amber-300 transition line-clamp-1">
                      {a.title}
                    </h3>
                    <p className="text-[11px] text-zinc-400 line-clamp-2 leading-relaxed">
                      {a.summary}
                    </p>
                  </div>
                  <div className="mt-3 pt-2 border-t border-brand-border/60 flex items-center justify-between text-[11px] text-amber-400 font-semibold">
                    <span>Đọc 1 phút</span>
                    <span className="group-hover:translate-x-1 transition">→</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Category Pills */}
      <div className="space-y-2">
        <div className="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar">
          <button
            onClick={() => setSelectedCat('all')}
            className={`px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition border ${
              selectedCat === 'all'
                ? 'bg-amber-400 text-black border-amber-400 font-black shadow-md'
                : 'bg-brand-surface hover:bg-brand-card text-zinc-400 hover:text-zinc-200 border-brand-border'
            }`}>
            Tất cả ({articles.length})
          </button>
          {categories.map(c => {
            const count = articles.filter(a => a.category === c.id).length;
            const isSel = selectedCat === c.id;
            return (
              <button
                key={c.id}
                onClick={() => setSelectedCat(c.id)}
                className={`px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition border flex items-center gap-1.5 ${
                  isSel
                    ? 'bg-amber-400 text-black border-amber-400 font-black shadow-md'
                    : 'bg-brand-surface hover:bg-brand-card text-zinc-400 hover:text-zinc-200 border-brand-border'
                }`}>
                <span>{c.icon}</span>
                <span>{c.name}</span>
                <span className="text-[10px] opacity-70">({count})</span>
              </button>
            );
          })}
        </div>
      </div>

      {/* Articles Grid (2-Layer concept cards) */}
      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {filtered.map(article => {
          const isRead = readArticles && !!readArticles[article.id];
          return (
            <article
              key={article.id}
              className="bg-brand-surface border border-brand-border hover:border-zinc-700 rounded-xl p-4 flex flex-col justify-between group transition duration-200 hover:shadow-xl hover:shadow-black/50">
              <div className="space-y-2.5">
                <div className="flex items-center justify-between gap-2">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-brand-card border border-brand-border text-zinc-300">
                    {categories.find(c => c.id === article.category)?.name || article.category}
                  </span>
                  <div className="flex items-center gap-1.5">
                    <span className="text-[10px] text-zinc-500">{article.readTime || '1 phút'}</span>
                    {isRead ? (
                      <span className="text-[10px] font-bold text-emerald-400 bg-emerald-500/10 px-1.5 py-0.2 rounded border border-emerald-500/20">
                        ✓ Đã đọc
                      </span>
                    ) : (
                      <span className="text-[10px] text-zinc-500 bg-zinc-800/80 px-1.5 py-0.2 rounded">
                        Chưa đọc
                      </span>
                    )}
                  </div>
                </div>

                <h3 
                  onClick={() => onOpenArticle(article)}
                  className="text-sm font-bold text-white group-hover:text-amber-400 transition cursor-pointer">
                  {article.title}
                </h3>

                {/* Layer 1: One-sentence explanation */}
                <p className="text-xs text-zinc-300 leading-relaxed line-clamp-3">
                  {article.summary}
                </p>

                {/* Formula / Simple Analogy snippet */}
                {article.formula ? (
                  <div className="bg-black/40 border border-brand-border/60 rounded-lg p-2 text-[11px] text-amber-200/90 font-mono line-clamp-2">
                    {article.formula}
                  </div>
                ) : (article.simple || article.simpleExplanation) ? (
                  <div className="bg-black/30 border border-brand-border/40 rounded-lg p-2 text-[11px] text-zinc-400 line-clamp-2 flex items-start gap-1.5">
                    <span className="text-amber-400 shrink-0 text-xs">💡</span>
                    <span className="italic">{article.simple || article.simpleExplanation}</span>
                  </div>
                ) : null}
              </div>

              {/* Bottom Actions */}
              <div className="mt-4 pt-3 border-t border-brand-border/60 flex items-center justify-between gap-2">
                <button
                  type="button"
                  onClick={() => onToggleRead(article.id)}
                  className={`text-[11px] font-medium transition ${
                    isRead ? 'text-zinc-500 hover:text-zinc-300' : 'text-zinc-400 hover:text-emerald-400'
                  }`}>
                  {isRead ? 'Đánh dấu chưa đọc' : '○ Đánh dấu đã đọc'}
                </button>

                <button
                  type="button"
                  onClick={() => onOpenArticle(article)}
                  className="px-3 py-1.5 rounded-lg text-xs font-bold bg-brand-card hover:bg-amber-500 hover:text-black text-amber-300 border border-brand-border hover:border-amber-400 transition flex items-center gap-1">
                  <span>Đọc 1 phút</span>
                  <span>→</span>
                </button>
              </div>
            </article>
          );
        })}
      </div>

      {filtered.length === 0 && (
        <div className="text-center py-12 bg-brand-surface border border-brand-border rounded-xl space-y-3">
          <p className="text-zinc-400 text-sm">Không tìm thấy bài viết nào khớp với từ khóa "{search}".</p>
          <button
            onClick={() => { setSearch(''); setSelectedCat('all'); }}
            className="px-4 py-2 rounded-xl text-xs font-bold bg-brand-card hover:bg-brand-hover text-white border border-brand-border">
            Xóa bộ lọc tìm kiếm
          </button>
        </div>
      )}
    </div>

function DemandValidationModal({ onClose, currentVideos, onUseKeyword, onAddToIdeas }) {
  const [topic, setTopic] = React.useState('');
  const [minViews, setMinViews] = React.useState(30000);
  const [timeframe, setTimeframe] = React.useState('30');
  const [hasScanned, setHasScanned] = React.useState(false);
  const [savedValidations, setSavedValidations] = React.useState(() => {
    try {
      return JSON.parse(localStorage.getItem('yt_validated_demands') || '[]');
    } catch(e) { return []; }
  });

  const runValidation = () => {
    setHasScanned(true);
  };

  // Evaluate matching videos from current dataset
  const results = React.useMemo(() => {
    if (!hasScanned) return null;
    const list = Array.isArray(currentVideos) ? currentVideos : [];
    const q = topic.trim().toLowerCase();

    const matched = list.filter(v => {
      const matchText = !q || (v.title && v.title.toLowerCase().includes(q)) || (v.channel && v.channel.toLowerCase().includes(q));
      const matchView = (v.views || 0) >= minViews;
      return matchText && matchView;
    });

    const channels = new Set(matched.map(v => v.channelId || v.channel));
    const channelCount = channels.size;

    // Freshness check: videos published within last 14 days
    const now = Date.now();
    const freshCount = matched.filter(v => {
      const pub = new Date(v.published).getTime();
      return (now - pub) <= 14 * 86400000;
    }).length;

    // Opportunity & Verdict Calculation
    let verdict = 'insufficient'; // 'verified' | 'fluke' | 'insufficient'
    let verdictTitle = '';
    let verdictDesc = '';

    if (channelCount >= 3) {
      verdict = 'verified';
      verdictTitle = '✅ NHU CẦU THỊ TRƯỜNG ĐÃ ĐƯỢC KIỂM CHỨNG!';
      verdictDesc = `Phát hiện ${matched.length} video từ ${channelCount} kênh độc lập khác nhau cùng vượt ngưỡng ${minViews.toLocaleString()} view. Đây là nhu cầu thật từ tệp khán giả lớn, KHÔNG PHẢI ăn may từ một kênh đơn lẻ.`;
    } else if (channelCount === 1 || channelCount === 2) {
      verdict = 'fluke';
      verdictTitle = '⚠️ CẢNH BÁO: CÓ THỂ LÀ HIỆN TƯỢNG ĂN MAY ĐƠN LẺ';
      verdictDesc = `Chỉ có ${channelCount} kênh đạt view cao với chủ đề này. Video viral có thể do sức hút cá nhân của YouTuber đó hoặc thuật toán đề xuất ngẫu nhiên, chưa đủ bằng chứng chứng minh một ngách bền vững. Cần thu thập thêm dữ liệu.`;
    } else {
      verdict = 'insufficient';
      verdictTitle = '❌ CHƯA ĐỦ DỮ LIỆU ĐẠT TIÊU CHÍ';
      verdictDesc = `Chưa tìm thấy video nào vượt mốc ${minViews.toLocaleString()} view trong tập dữ liệu hiện tại. Hãy thử hạ thấp ngưỡng view hoặc mở rộng từ khóa tìm kiếm.`;
    }

      matched,

      freshCount,
      verdict,
      verdictTitle,
      verdictDesc
    };

      localStorage.setItem('yt_validated_demands', JSON.stringify(updated));
    } catch(e) {}

      <div

// Helper to normalize channel & feasibility diagnosis data
function normalizeNicheChannelData(niche, data, currentSubLimit = 30000) {
  if (!data) return { status: 'not_scanned', channels: [] };
  if (Array.isArray(data)) {
    if (data.length > 0 && data[0].isVerifiedApi) {
      return {
        status: 'found',
        channels: data.slice(0, 3),
        minSubFound: null,
        subLimit: currentSubLimit,
        reason: `Tìm thấy ${data.length} kênh thực tế từ YouTube Data API.`
      };
    }
    return { status: 'not_scanned', channels: [] };
  }
  if (typeof data === 'object') {
    return {
      status: data.status || (data.channels && data.channels.length > 0 ? 'found' : 'infeasible'),
      channels: data.channels || [],
      minSubFound: data.minSubFound !== undefined ? data.minSubFound : null,
      subLimit: data.subLimit || currentSubLimit,
      reason: data.reason || '',
      scannedAt: data.scannedAt
    };
  }
  return { status: 'not_scanned', channels: [] };
}

// Get comprehensive channel summary & feasibility status for a niche
function getNicheChannelSummary(niche, realChannelsMap, currentSubLimit = 30000) {
  if (!niche) return { status: 'not_scanned', channels: [] };
  const data = realChannelsMap ? realChannelsMap[niche.id] : null;
  if (data) return normalizeNicheChannelData(niche, data, currentSubLimit);

  try {
    const raw = localStorage.getItem('yt_real_channels_cache');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed[niche.id]) {
        return normalizeNicheChannelData(niche, parsed[niche.id], currentSubLimit);
      }
    }
  } catch (e) {}
  return { status: 'not_scanned', channels: [] };
}

// Helper to extract 1-3 REAL active channels for a niche directly from YouTube Data API
function getNicheChannels(niche, realChannelsMap) {
  const summary = getNicheChannelSummary(niche, realChannelsMap);
  if (summary.status === 'found' && summary.channels.length > 0) {
    return summary.channels;
  }
  if (summary.status === 'infeasible') {
    return [];
  }
  const qTerm = (niche && niche.queries && niche.queries[0]) || (niche && niche.name) || '';
  return [{
    name: 'Tìm kênh về ' + (niche?.name || ''),
    subs: null,
    url: `https://www.youtube.com/results?search_query=${encodeURIComponent(qTerm)}&sp=EgIQAg%253D%253D`,
    isSearchQuery: true
  }];
}

    const stopWords = new Set([
      'the', 'and', 'in', 'of', 'to', 'for', 'with', 'a', 'an', 'is', 'on', 'this', 'that', 'by',
      'how', 'what', 'why', 'who', 'from', 'at', 'into', 'part', 'episode', 'full', 'video', 'watch',
      'your', 'you', 'are', 'was', 'were', 'been', 'will', 'about', 'after', 'before', 'more', 'most'
    ]);
    const freq = {};
    cleaned.forEach(w => {
      if (w.length > 3 && !stopWords.has(w)) {
        freq[w] = (freq[w] || 0) + 1;
      }
    });
    const topKeywords = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 2).map(x => x[0]);
    if (topKeywords.length > 0) {
      const cap = topKeywords.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' & ');

              name: chInfo.name,
              subs: chInfo.subCount,
              url: 'https://www.youtube.com/channel/' + chInfo.id,
              videoCount: chInfo.videoCount,
              country: chInfo.country
            };
          }
        });

        // 5. Nếu chủ đề có video thỏa mãn, tạo thành 1 Ngách Mới Động
        if (eligibleVideosInTopic.length > 0) {
          eligibleVideosInTopic.sort((a, b) => b.views - a.views);
          const channelList = Object.values(eligibleChannelsMap);
          totalEligibleVideosFound += eligibleVideosInTopic.length;
          totalEligibleChannelsFound += channelList.length;

          const inferredTitle = inferNicheTitle(topic.label, eligibleVideosInTopic);
          const maxViews = eligibleVideosInTopic[0].views;
          const maxOutlier = Math.max(...eligibleVideosInTopic.map(v => Number(v.outlierRatio) || 0));

          discoveredList.push({
            id: 'niche_' + topic.id + '_' + Date.now(),
            name: inferredTitle,
            category: topic.label,
            rpmRange: topic.rpm,
            avgRpm: Number(topic.rpm.split('-')[0].replace(/\D/g, '')) || 25,
            channelsCount: channelList.length,
            channels: channelList,
            videos: eligibleVideosInTopic,
            topVideo: eligibleVideosInTopic[0],
            maxViews: maxViews,
            maxOutlier: maxOutlier.toFixed(1),
            scannedAt: Date.now()
          });
        }

        await new Promise(r => setTimeout(r, 200));
      }

      // Sắp xếp các ngách tìm được: Ngách có view cao nhất lên đầu
      discoveredList.sort((a, b) => b.maxViews - a.maxViews);

      const nowStr = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' ' + new Date().toLocaleDateString('vi-VN');
      setLastScannedTime(nowStr);

      // BẢO TOÀN DỮ LIỆU ĐÃ QUÉT & TỰ ĐỘNG XOÁ KHI HẠ NHIỆT (>10 NGÀY)
      setRealDiscoveredNiches(prevList => {
        const nicheMap = new Map();
        (prevList || []).forEach(n => {
          if (n.id && n.id.includes('_init')) return;
          const key = (n.category || n.name || '').trim().toLowerCase();
          if (key) nicheMap.set(key, n);
        });

        (discoveredList || []).forEach(newNiche => {
          const key = (newNiche.category || newNiche.name || '').trim().toLowerCase();
          if (nicheMap.has(key)) {
            const existing = nicheMap.get(key);
            // Gộp video thật, loại trùng ID
            const vMap = new Map();
            (existing.videos || []).forEach(v => vMap.set(v.id, v));
            (newNiche.videos || []).forEach(v => vMap.set(v.id, v));
            const mergedVids = Array.from(vMap.values());
            mergedVids.sort((a, b) => (b.views || 0) - (a.views || 0));

            // Gộp kênh thật
            const chMap = new Map();
            (existing.channels || []).forEach(c => chMap.set(c.id, c));
            (newNiche.channels || []).forEach(c => chMap.set(c.id, c));

            nicheMap.set(key, {
              ...existing,
              name: newNiche.name || existing.name,
              videos: mergedVids,
              channels: Array.from(chMap.values()),
              channelsCount: chMap.size,
              topVideo: mergedVids[0],
              maxViews: mergedVids[0]?.views || existing.maxViews,
              maxOutlier: Math.max(Number(existing.maxOutlier) || 0, Number(newNiche.maxOutlier) || 0).toFixed(1),
              scannedAt: Date.now()
            });
          } else {
            nicheMap.set(key, newNiche);
          }
        });

        // Tự động xoá ngách/video đã hạ nhiệt (> 10 ngày)
        const now = Date.now();
        let finalMerged = Array.from(nicheMap.values()).map(n => {
          const freshVids = (n.videos || []).filter(v => {
            const vt = v.ts || (v.published ? new Date(v.published).getTime() : 0);
            return (now - vt) <= 10 * 864e5; // 10 ngày
          });
          if (freshVids.length === 0) return null; // hạ nhiệt -> tự xoá
          return {
            ...n,
            videos: freshVids,
            topVideo: freshVids[0],
            maxViews: freshVids[0]?.views || n.maxViews
          };
        }).filter(Boolean);

        finalMerged.sort((a, b) => (b.maxViews || 0) - (a.maxViews || 0));
        const finalSaved = finalMerged.slice(0, 20);

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(finalSaved));
          localStorage.setItem(TIME_KEY, nowStr);
        } catch (e) {}

        if (finalSaved.length > 0 && (!activeNicheId || !finalSaved.some(n => n.id === activeNicheId))) {
          setActiveNicheId(finalSaved[0].id);
        }

        return finalSaved;
      });

      if (typeof showToast === 'function') {
        showToast(
          discoveredList.length > 0
            ? `Thành công! Đã bóc tách được ${discoveredList.length} ngách trend từ các kênh <${subLimitFilter/1000}k sub trong 10 ngày qua.`

          discoveredList.length > 0 ? 'success' : 'info'
        );
      }

      console.error('Scan error:', err);
      if (typeof showToast === 'function') showToast('Lỗi khi quét: ' + (err.message || 'Lỗi API'), 'error');
    } finally {
      setIsScanningNiches(false);
      setScanProgress(null);
    }

            <button

            {/* 4. THANH CÔNG CỤ TINH GỌN (1 HÀNG): BÊN TRÁI TÌM KIẾM, BÊN PHẢI BỘ LỌC ĐỊNH DẠNG */}

                  }`}>
                  <span>Tất cả</span>
                  <span className={`text-[11px] px-1.5 py-0.5 rounded-md font-mono ${videoFormatFilter === 'all' ? 'bg-zinc-950 text-zinc-200' : 'bg-zinc-950/80 text-zinc-400'}`}>
                    {formatCounts.all}
                  </span>
                </button>

                <button
                  type="button"
                  onClick={() => setVideoFormatFilter('long')}
                  className={`px-3 sm:px-3.5 py-1.5 rounded-lg font-medium transition cursor-pointer flex items-center gap-1.5 ${
                    videoFormatFilter === 'long'
                      ? 'bg-zinc-800 text-white font-semibold shadow-sm border border-zinc-700'
                      : 'text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/40'
                  }`}>
                  <span>Video dài</span>
                  <span className={`text-[11px] px-1.5 py-0.5 rounded-md font-mono ${videoFormatFilter === 'long' ? 'bg-zinc-950 text-zinc-200' : 'bg-zinc-950/80 text-zinc-400'}`}>
                    {formatCounts.long}
                  </span>
                </button>

                <button
                  type="button"
                  onClick={() => setVideoFormatFilter('short')}
                  className={`px-3 sm:px-3.5 py-1.5 rounded-lg font-medium transition cursor-pointer flex items-center gap-1.5 ${
                    videoFormatFilter === 'short'
                      ? 'bg-zinc-800 text-white font-semibold shadow-sm border border-zinc-700'
                      : 'text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/40'
                  }`}>
                  <span>Shorts</span>
                  <span className={`text-[11px] px-1.5 py-0.5 rounded-md font-mono ${videoFormatFilter === 'short' ? 'bg-zinc-950 text-zinc-200' : 'bg-zinc-950/80 text-zinc-400'}`}>
                    {formatCounts.short}
                  </span>
                </button>

                <button
                  type="button"
                  onClick={() => setVideoFormatFilter('live')}
                  className={`px-3 sm:px-3.5 py-1.5 rounded-lg font-medium transition cursor-pointer flex items-center gap-1.5 ${
                    videoFormatFilter === 'live'
                      ? 'bg-zinc-800 text-white font-semibold shadow-sm border border-zinc-700'
                      : 'text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/40'
                  }`}>
                  <span>Live</span>
                  <span className={`text-[11px] px-1.5 py-0.5 rounded-md font-mono ${videoFormatFilter === 'live' ? 'bg-zinc-950 text-zinc-200' : 'bg-zinc-950/80 text-zinc-400'}`}>
                    {formatCounts.live}
                  </span>
                </button>
              </div>

              {onSelectKeywordForSearch && (
                <button
                  type="button"
                  onClick={() => {
                    if (!isPro) {
                      if (typeof showToast === 'function') showToast('Tính năng bắt trend ngách dành riêng cho gói PRO!', 'info');
                      if (onUpgradePrompt) onUpgradePrompt();
                      return;
                    }
                    onSelectKeywordForSearch(activeNiche.category || activeNiche.name);
                  }}
                  className="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 transition cursor-pointer shrink-0">
                  Bắt Trend ↗
                </button>
              )}
            </div>
          );
        })()}
      </div>

      {/* 5. DANH SÁCH VIDEO THỰC TẾ CỦA NGÁCH ĐANG CHỌN */}
      {activeNiche && (() => {
        const vids = activeNiche.videos || [];
        const filteredVideos = vids.filter(v => {
          if (videoFormatFilter === 'all') return true;
          return getVideoFormat(v) === videoFormatFilter;
        });

        return (
          <div className="space-y-2 pt-1">
            {/* Tiêu đề ngách thanh mảnh, tinh tế */}
            <div className="flex items-center justify-between text-xs px-1">
              <span className="text-zinc-300 font-semibold flex items-center gap-1.5">
                <span>🎬</span> Video Thực Tế: <b className="text-white">{activeNiche.name}</b>
              </span>
              <span className="text-[11px] text-zinc-500">
                Hiển thị {filteredVideos.length}/{vids.length} video kênh &lt;30k sub trong 10 ngày qua
              </span>
            </div>

            {/* Thông báo nếu không có video thuộc phân loại đang chọn */}
            {filteredVideos.length === 0 ? (
              <div className="p-8 text-center border border-dashed border-zinc-800 rounded-xl bg-[#121316] space-y-2">
                <span className="text-2xl block">🔍</span>
                <p className="text-xs text-zinc-300 font-semibold">
                  Không có video nào thuộc dạng {videoFormatFilter === 'short' ? 'Shorts' : videoFormatFilter === 'live' ? 'Trực Tiếp (Live)' : 'Video Dài'} trong ngách này
                </p>
                <p className="text-[11px] text-zinc-500">
                  Hãy bấm &quot;Tất Cả&quot; để xem toàn bộ {vids.length} video của ngách.
                </p>
                <button
                  type="button"
                  onClick={() => setVideoFormatFilter('all')}
                  className="mt-1 px-3 py-1 rounded-lg text-xs font-semibold bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 cursor-pointer">
                  Xem Tất Cả Video
                </button>
              </div>
            ) : (
              /* Lưới video thực tế */
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-4 xl:grid-cols-5 gap-2.5 sm:gap-3">
                {filteredVideos.map((v, idx) => {
                  const ytUrl = 'https://www.youtube.com/watch?v=' + v.id;
                  const chUrl = 'https://www.youtube.com/channel/' + (v.channelId || '');
                  const saved = isSaved && isSaved(v.id);
                  const rev = typeof calcEstimatedRev === 'function' ? calcEstimatedRev(v.views, v.dur, activeNiche.avgRpm || 30) : { low: 50, high: 150, midrolls: 6 };
                  const vFmt = getVideoFormat(v);

                  return (
                    <article
                      key={v.id || idx}
                      className="bg-[#121316] border border-zinc-800 hover:border-zinc-600 rounded-xl overflow-hidden flex flex-col group transition shadow-sm hover:shadow-md">
                      {/* Thumbnail Container */}
                      <a
                        href={ytUrl}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="relative aspect-video bg-zinc-900 overflow-hidden block"
                        title="Mở xem trên YouTube">
                        <img
                          src={v.thumb}
                          alt=""
                          className="w-full h-full object-cover group-hover:scale-102 transition duration-200"
                          loading="lazy"
                        />

                        {/* Sub Count Badge */}
                        <div className="absolute top-1.5 left-1.5 text-[9px] font-medium px-1.5 py-0.5 rounded bg-black/85 text-zinc-300 backdrop-blur-sm border border-zinc-700/80">
                          {v.subs ? (typeof fmt === 'function' ? fmt(v.subs) : v.subs) + ' subs' : 'Kênh nhỏ'}
                        </div>

                        {/* Outlier Ratio Badge */}
                        {v.outlierRatio && (
                          <div className="absolute top-1.5 right-1.5 text-[9px] font-bold px-1.5 py-0.5 rounded bg-zinc-900/90 text-amber-300 backdrop-blur-sm border border-amber-500/40">
                            🔥 x{v.outlierRatio} View/Sub
                          </div>
                        )}

                        {/* Breakout Channel Indicator */}
                        {v.isBreakout && (
                          <div className="absolute bottom-1.5 left-1.5 text-[9px] font-medium px-1.5 py-0.5 rounded bg-zinc-900/90 text-zinc-200 border border-zinc-600 backdrop-blur-sm">
                            🚀 Tân binh
                          </div>
                        )}

                        {/* Duration & Phân Loại Badge (Short / Dài / Live) */}
                        {vFmt === 'live' ? (
                          <div className="absolute bottom-1.5 right-1.5 text-[9px] font-bold px-1.5 py-0.5 rounded bg-red-600 text-white backdrop-blur-sm border border-red-500 flex items-center gap-1 shadow-sm">
                            <span className="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                            <span>LIVE</span>
                          </div>
                        ) : vFmt === 'short' ? (
                          <div className="absolute bottom-1.5 right-1.5 text-[9px] font-bold px-1.5 py-0.5 rounded bg-rose-950/95 text-rose-300 backdrop-blur-sm border border-rose-500/60 flex items-center gap-1 shadow-sm">
                            <span>⚡ Shorts</span>
                            <span className="text-zinc-400 font-mono pl-0.5">{typeof fmtDur === 'function' ? fmtDur(v.dur) : '0:45'}</span>
                          </div>
                        ) : (
                          <div className="absolute bottom-1.5 right-1.5 text-[9px] font-medium px-1.5 py-0.5 rounded bg-black/85 text-zinc-300 backdrop-blur-sm border border-zinc-800 flex items-center gap-1">
                            <span>🎬 {typeof fmtDur === 'function' ? fmtDur(v.dur) : '25:00'}</span>
                            {rev.midrolls > 0 && (
                              <span className="text-zinc-400 border-l border-zinc-700 pl-1">~{rev.midrolls} Ads</span>
                            )}
                          </div>
                        )}
                      </a>

                      {/* Card Body */}
                      <div className="p-2.5 flex flex-col gap-1.5 flex-1 justify-between text-xs">
                        <div className="space-y-1">
                          <a
                            href={ytUrl}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="text-xs sm:text-[13px] font-semibold text-zinc-200 line-clamp-2 leading-snug hover:text-white transition"
                            title={v.title}>
                            {v.title}
                          </a>

                          <div className="text-[11px] text-zinc-400 flex items-center justify-between gap-1">
                            <a
                              href={chUrl}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="truncate max-w-[120px] font-medium text-zinc-300 hover:text-white flex items-center gap-1 transition"
                              title="Mở kênh trên YouTube">
                              <span>📺</span>
                              <span className="truncate">{v.channel}</span>
                              {v.country && v.country !== 'N/A' && (
                                <span className="text-[9px] text-zinc-500 font-mono">[{v.country}]</span>
                              )}
                            </a>
                            <span className="text-[10px] text-zinc-500 shrink-0 font-medium">
                              RPM {activeNiche.rpmRange ? activeNiche.rpmRange.split('-')[0].trim() : '$25+'}
                            </span>
                          </div>
                        </div>

                        {/* Metric Row */}
                        <div className="pt-1 border-t border-zinc-800/80 flex items-center justify-between text-[10px] text-zinc-400">
                          <span className="text-zinc-300 font-medium">
                            👁️ {typeof fmt === 'function' ? fmt(v.views) : v.views}
                          </span>
                          {v.vph ? (
                            <span className="text-zinc-300 font-medium">
                              ⚡+{typeof fmt === 'function' ? fmt(v.vph) : v.vph}/h
                            </span>
                          ) : null}
                          <span className="text-zinc-300 font-medium">
                            ${typeof fmt === 'function' ? fmt(rev.low) : rev.low}-${typeof fmt === 'function' ? fmt(rev.high) : rev.high}
                          </span>
                        </div>

                        {/* Nút Soi Video & Tags (1 Quota) */}
                        <button
                          type="button"
                          onClick={() => {
                          if (!isPro) {
                            if (typeof showToast === 'function') showToast('Soi tags ẩn và bản quyền chuyên sâu chỉ dành cho gói PRO!', 'info');
                            if (onUpgradePrompt) onUpgradePrompt();
                            return;
                          }
                          setInspectingVideo(v);
                        }}
                          className="w-full py-1 px-2 rounded-lg font-medium text-[11px] bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 hover:border-zinc-500 flex items-center justify-center gap-1.5 transition cursor-pointer"
                          title="Soi tags ẩn, bản quyền, tương tác và lấy 50 video của kênh chỉ tốn 1 quota">
                          <span>🔍</span>
                          <span>Soi Video &amp; Tags</span>
                          {v.tags && v.tags.length > 0 && (
                            <span className="text-[9px] px-1 py-0.2 rounded bg-zinc-900 text-zinc-400 font-mono">
                              {v.tags.length}
                            </span>
                          )}
                        </button>

                        {/* Quick Action Buttons */}
                        <div className="flex items-center gap-1 text-[10px]">
                          {onToggleSave && (
                            <button
                              type="button"
                              onClick={() => {
                                if (!isPro) {
                                  if (typeof showToast === 'function') showToast('Lưu video ngách dành riêng cho gói PRO!', 'info');
                                  if (onUpgradePrompt) onUpgradePrompt();
                                  return;
                                }
                                onToggleSave(v);
                              }}
                              className={`flex-1 py-1 px-1.5 rounded-md font-medium transition text-center truncate cursor-pointer ${
                                saved
                                  ? 'bg-zinc-200 text-zinc-950 font-semibold'
                                  : 'bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700'
                              }`}>
                              {saved ? '✓ Đã Lưu' : '🔖 Lưu'}
                            </button>
                          )}
                          {onAddCompetitor && (
                            <button
                              type="button"
                              onClick={() => {
                                if (!isPro) {
                                  if (typeof showToast === 'function') showToast('Thêm kênh đối thủ dành riêng cho gói PRO!', 'info');
                                  if (onUpgradePrompt) onUpgradePrompt();
                                  return;
                                }
                                onAddCompetitor(v.channel);
                              }}
                              className="py-1 px-1.5 rounded-md font-medium bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700 transition truncate cursor-pointer"
                              title="Thêm kênh này vào danh sách theo dõi đối thủ">
                              + Kênh
                            </button>
                          )}
                          <a
                            href={ytUrl}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="py-1 px-2 rounded-md font-medium bg-zinc-800 text-zinc-300 border border-zinc-700 hover:bg-zinc-700 hover:text-white transition text-center truncate shrink-0"
                            title="Xem trực tiếp trên YouTube">
                            YT ↗
                          </a>
                        </div>
                      </div>
                    </article>
                  );
                })}
              </div>
            )}
          </div>
        );
      })()}


      {!isPro && (
        <div className="relative overflow-hidden rounded-2xl bg-gradient-to-r from-amber-950/40 via-[#181b26] to-[#121316] border border-amber-500/30 p-5 sm:p-6 text-center sm:text-left flex flex-col sm:flex-row items-center justify-between gap-4 mt-5 shadow-xl">
          <div className="space-y-1.5">
            <div className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 text-[10px] font-bold border border-amber-500/30">
              <span>👑</span> DÀNH RIÊNG CHO TÀI KHOẢN PRO
            </div>
            <h4 className="text-sm sm:text-base font-black text-white">
              Bạn đang xem 1 chủ đề demo cơ bản hôm nay. Muốn mở khóa toàn bộ các ngách bứt phá triệu view khác?
            </h4>
            <p className="text-xs text-zinc-300 max-w-xl leading-relaxed">
              Hệ thống tự động phát hiện hàng chục ngách bứt phá view khủng x10–x50 mỗi ngày, quét video từ kênh nhỏ ít sub, bóc tách từ khóa và soi tags bí mật.
            </p>
          </div>
          <button
            type="button"
            onClick={() => {
              if (onUpgradePrompt) onUpgradePrompt();
            }}
            className="px-6 py-3 rounded-xl text-xs sm:text-sm font-black bg-gradient-to-r from-amber-500 to-red-600 hover:from-amber-400 hover:to-red-500 text-white shadow-lg shadow-amber-500/25 transition cursor-pointer shrink-0 transform hover:-translate-y-0.5">
            Nâng Cấp Gói PRO Để Xem Tiếp →
          </button>
        </div>
      )}

      {/* Video Inspector Modal (Hidden Tags, 1-Quota 50 Videos, Copyright & Organic Check) */}
      {inspectingVideo && (
        <VideoInspectorModal
          video={inspectingVideo}
          apiKey={apiKey}
          onClose={() => setInspectingVideo(null)}
          onToggleSave={onToggleSave}
          isSaved={isSaved}
          onAddCompetitor={onAddCompetitor}
          showToast={showToast}
        />
      )}

      {/* API Features & Changelog Guide Modal */}
      {showApiGuideModal && (
        <ApiFeaturesGuideModal onClose={() => setShowApiGuideModal(false)} />
      )}
    </section>
  );
}

                  {niche.scriptPromptTpl ? niche.scriptPromptTpl(niche.sampleVideos?.[0]?.title || niche.name, niche.exampleChannel) : 'Chưa có prompt mẫu'}
                </pre>
              </div>

              <div className="space-y-1.5">

                    Sao chép prompt
                  </button>
                </div>
                <pre className="p-3 rounded-xl bg-black/60 border border-zinc-800 text-[11px] text-zinc-300 font-mono whitespace-pre-wrap max-h-36 overflow-y-auto">
                  {niche.thumbPromptTpl ? niche.thumbPromptTpl(niche.sampleVideos?.[0]?.title || niche.name) : 'Chưa có prompt thumbnail'}
                </pre>
              </div>
            </div>
          )}
        </div>

        {/* Modal Footer */}
        <div className="p-3 sm:p-4 border-t border-brand-border bg-brand-card/40 flex items-center justify-between">
          <button
            onClick={() => {
              if (niche.queries && niche.queries[0]) {
                onSelectKeywordForSearch(niche.queries[0]);
                onClose();
              }
            }}
            className="px-4 py-2 rounded-xl text-xs font-bold bg-amber-400 hover:bg-amber-300 text-black transition flex items-center gap-1.5 shadow-md">
            <span>🎯 Bắt Trend Cụm Từ Khóa Ngách Này</span>

          <button
            onClick={onClose}

            Đóng

        </div>
      </div>
    </div>
  );
}

// Cửa Sổ Soi Video Chuyên Sâu (Hidden Tags, 1-Quota 50 Videos, Copyright & Organic Check)
function VideoInspectorModal({ video, apiKey, onClose, onToggleSave, isSaved, onAddCompetitor, showToast }) {
  const [activeTab, setActiveTab] = React.useState('tags'); // 'tags' | 'uploads' | 'analytics'
  const [uploadsVideos, setUploadsVideos] = React.useState([]);
  const [loadingUploads, setLoadingUploads] = React.useState(false);
  const [uploadsError, setUploadsError] = React.useState(null);

  if (!video) return null;

  const ytUrl = 'https://www.youtube.com/watch?v=' + video.id;
  const chUrl = 'https://www.youtube.com/channel/' + (video.channelId || '');
  const saved = isSaved && isSaved(video.id);
  const tags = video.tags || [];

  const copyToClipboard = (text, msg) => {
    try {
      if (navigator && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      if (showToast) showToast(msg || 'Đã sao chép vào bộ nhớ tạm!');
    } catch (e) {
      if (showToast) showToast('Lỗi khi sao chép: ' + String(e));
    }
  };

  const loadUploads = React.useCallback(async () => {
    if (!apiKey) {
      setUploadsError('Cần YouTube Data API Key để tải danh sách video.');
      return;
    }
    const uploadsId = video.uploadsId || (video.channelId ? video.channelId.replace(/^UC/, 'UU') : null);
    if (!uploadsId) {
      setUploadsError('Không tìm thấy mã Uploads Playlist của kênh này.');
      return;
    }
    setLoadingUploads(true);
    setUploadsError(null);
    try {
      const res = await yt('playlistItems', {
        part: 'snippet,contentDetails',
        playlistId: uploadsId,
        maxResults: 50
      }, apiKey);
      const items = (res.items || []).map(item => ({
        id: item.contentDetails?.videoId || item.snippet?.resourceId?.videoId,
        title: item.snippet?.title || '',
        thumb: item.snippet?.thumbnails?.medium?.url || item.snippet?.thumbnails?.default?.url || '',
        published: item.snippet?.publishedAt || item.contentDetails?.videoPublishedAt || ''
      })).filter(x => Boolean(x.id));
      setUploadsVideos(items);
    } catch (err) {
      setUploadsError(err.msg || 'Không thể tải video từ Uploads Playlist.');
    } finally {
      setLoadingUploads(false);
    }
  }, [apiKey, video.uploadsId, video.channelId]);

  React.useEffect(() => {
    if (activeTab === 'uploads' && uploadsVideos.length === 0 && !loadingUploads) {
      loadUploads();
    }
  }, [activeTab, uploadsVideos.length, loadingUploads, loadUploads]);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-5 bg-black/80 backdrop-blur-sm overflow-y-auto animate-in fade-in duration-200">
      <div className="bg-[#121316] border border-zinc-800 rounded-2xl max-w-3xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden my-auto text-zinc-200">
        {/* Modal Header */}
        <div className="p-4 sm:p-5 border-b border-zinc-800 flex items-start justify-between gap-3 bg-zinc-900/60">
          <div className="space-y-1 pr-2">
            <div className="flex items-center gap-2 flex-wrap text-[11px]">
              <span className="px-2 py-0.5 rounded bg-zinc-800 text-zinc-300 border border-zinc-700 font-medium">
                {video.subs ? (typeof fmt === 'function' ? fmt(video.subs) : video.subs) + ' subs' : 'Kênh nhỏ'}
              </span>
              {video.outlierRatio && (
                <span className="px-2 py-0.5 rounded bg-zinc-800 text-amber-300 border border-amber-500/40 font-bold">
                  🔥 x{video.outlierRatio} View/Sub
                </span>
              )}
              {video.country && video.country !== 'N/A' && (
                <span className="px-2 py-0.5 rounded bg-zinc-800 text-zinc-400 font-mono">
                  🌍 {video.country}
                </span>
              )}
              {video.isBreakout && (
                <span className="px-2 py-0.5 rounded bg-zinc-800 text-zinc-200 border border-zinc-600 font-medium">
                  🚀 Tân binh &lt;90 ngày
                </span>
              )}
            </div>
            <h2 className="text-sm sm:text-base font-bold text-white line-clamp-2 leading-snug pt-1">
              {video.title}
            </h2>
            <div className="flex items-center gap-2 text-xs text-zinc-400 pt-0.5">
              <a
                href={chUrl}
                target="_blank"
                rel="noopener noreferrer"
                className="text-zinc-300 hover:text-white font-medium flex items-center gap-1">
                <span>📺</span>
                <span>{video.channel}</span>
                <span>↗</span>
              </a>
              <span>•</span>
              <span>{typeof fmt === 'function' ? fmt(video.views) : video.views} views</span>
              {video.vph ? (
                <span className="text-zinc-300">(+{typeof fmt === 'function' ? fmt(video.vph) : video.vph}/h)</span>
              ) : null}
            </div>
          </div>
          <button
            type="button"
            onClick={onClose}
            className="w-8 h-8 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-white flex items-center justify-center transition shrink-0 cursor-pointer">
            ✕
          </button>
        </div>

        {/* Modal Navigation Tabs */}
        <div className="flex border-b border-zinc-800 px-4 sm:px-5 gap-4 text-xs font-medium bg-zinc-900/30">

            type="button"
            onClick={() => setActiveTab('tags')}

                : 'border-transparent text-zinc-400 hover:text-zinc-200'
            }`}>
            <span>🏷️ Thẻ Tags Ẩn ({tags.length})</span>
          </button>
          <button

            onClick={() => setActiveTab('uploads')}

              activeTab === 'uploads'
                ? 'border-zinc-200 text-white font-semibold'
                : 'border-transparent text-zinc-400 hover:text-zinc-200'
            }`}>
            <span>📺 50 Video Mới (1 Quota)</span>
          </button>
          <button
            type="button"
            onClick={() => setActiveTab('analytics')}
            className={`py-3 border-b-2 transition cursor-pointer flex items-center gap-1.5 ${
              activeTab === 'analytics'
                ? 'border-zinc-200 text-white font-semibold'
                : 'border-transparent text-zinc-400 hover:text-zinc-200'
            }`}>
            <span>🛡️ Bản Quyền &amp; Tương Tác Thật</span>
          </button>
        </div>

        {/* Modal Body */}
        <div className="p-4 sm:p-5 overflow-y-auto space-y-4 flex-1 text-xs">

          {activeTab === 'tags' && (

                {tags.length > 0 && (

                      className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-zinc-200 hover:bg-white text-zinc-900 transition cursor-pointer">
                      📋 Sao Chép (Dấu phẩy)
                    </button>
                    <button

                      📑 Dạng Danh Sách
                    </button>
                  </div>
                )}
              </div>

              {tags.length > 0 ? (
                <div className="flex flex-wrap gap-1.5 max-h-72 overflow-y-auto p-1">
                  {tags.map((t, idx) => (
                    <button

                      <span className="text-[10px] text-zinc-500">#{idx + 1}</span>
                      <span>{t}</span>
                    </button>
                  ))}
                </div>
              ) : (
                <div className="p-8 text-center border border-dashed border-zinc-800 rounded-xl bg-zinc-900/30 space-y-1.5">
                  <p className="text-zinc-300 font-medium">Không có thẻ tags ẩn nào.</p>
                  <p className="text-zinc-500 text-[11px]">
                    Tác giả video này dựa hoàn toàn vào từ khóa trong Tiêu Đề và Mô Tả video để ăn đề xuất.
                  </p>
                </div>
              )}
            </div>
          )}

          {/* Tab 2: Uploads 50 video (1 Quota) */}
          {activeTab === 'uploads' && (
            <div className="space-y-3">
              <div className="p-3 rounded-xl bg-zinc-900/60 border border-zinc-800 flex items-start gap-2.5">
                <span className="text-base shrink-0">⚡</span>
                <div className="space-y-0.5">
                  <p className="text-xs font-semibold text-zinc-200">Tiết kiệm 99% Quota API YouTube</p>
                  <p className="text-[11px] text-zinc-400">
                    Tải trực tiếp từ Playlist Uploads (<code className="text-zinc-300 font-mono">{video.uploadsId || 'UU...'}</code>) chỉ tiêu tốn đúng <b className="text-white">1 Quota</b> (thay vì 100 Quota với tìm kiếm thông thường).
                  </p>
                </div>
              </div>

              {loadingUploads ? (
                <div className="p-10 text-center space-y-2 border border-dashed border-zinc-800 rounded-xl">
                  <div className="w-5 h-5 border-2 border-zinc-300 border-t-transparent rounded-full animate-spin mx-auto"></div>
                  <p className="text-xs text-zinc-400">Đang tải 50 video mới nhất (1 Quota)...</p>
                </div>
              ) : uploadsError ? (
                <div className="p-6 text-center text-zinc-400 border border-zinc-800 rounded-xl bg-zinc-900/40 space-y-2">
                  <p className="text-xs text-zinc-300">{uploadsError}</p>
                  <button
                    type="button"
                    onClick={loadUploads}
                    className="px-3 py-1 rounded-lg text-xs font-semibold bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 cursor-pointer">
                    Thử lại
                  </button>
                </div>
              ) : (
                <div className="space-y-2 max-h-80 overflow-y-auto pr-1">
                  {uploadsVideos.map((item, idx) => (
                    <div

                      className="p-2 rounded-xl bg-zinc-900/60 border border-zinc-800/80 hover:border-zinc-700 flex items-center justify-between gap-3 transition">
                      <div className="flex items-center gap-2.5 min-w-0">

                        <div className="min-w-0">

                          <span className="text-[10px] text-zinc-500 block pt-0.5">

                      </a>
                    </div>

                </div>
              )}
            </div>
          )}

          {/* Tab 3: Bản Quyền, Breakout & Organic Rate */}

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              {/* Box 1: Content ID */}
              <div className="p-3.5 rounded-xl bg-zinc-900/60 border border-zinc-800 space-y-1.5">
                <div className="flex items-center justify-between">
                  <span className="text-[11px] text-zinc-400 font-medium">Bản Quyền Content ID</span>
                  <span
                    className={`text-[10px] px-1.5 py-0.5 rounded font-mono ${
                      video.licensedContent ? 'bg-zinc-800 text-zinc-200 border border-zinc-700' : 'bg-zinc-800 text-zinc-400'

                    {video.licensedContent ? 'Licensed' : 'Unlicensed'}
                  </span>
                </div>
                <p className="text-xs font-semibold text-white">
                  {video.licensedContent ? 'Đã kích hoạt Content ID' : 'Chưa có bản quyền Content ID'}
                </p>
                <p className="text-[11px] text-zinc-400 leading-relaxed">
                  {video.licensedContent
                    ? 'Video này có chứa nội dung (âm thanh/hình ảnh) đã được đăng ký hệ thống Content ID tự động của YouTube. Cần cẩn trọng bản quyền khi reup hoặc làm video tương tự.'
                    : 'Không phát hiện bản quyền Content ID tự động. Kênh tự sản xuất hoặc dùng tài nguyên tự do.'}
                </p>
              </div>

              {/* Box 2: Organic Engagement */}
              <div className="p-3.5 rounded-xl bg-zinc-900/60 border border-zinc-800 space-y-1.5">
                <div className="flex items-center justify-between">
                  <span className="text-[11px] text-zinc-400 font-medium">Tương Tác Thật vs View Ảo</span>

                    className={`text-[10px] px-1.5 py-0.5 rounded font-mono ${
                      video.isOrganic ? 'bg-zinc-800 text-zinc-200 border border-zinc-700' : 'bg-zinc-800 text-amber-300 border border-amber-500/30'

                  </span>
                </div>
                <p className="text-xs font-semibold text-white">

              </div>

        <div className="p-3 sm:p-4 border-t border-zinc-800 bg-zinc-900/60 flex items-center justify-between gap-2">
          <div className="flex items-center gap-2">
            {onToggleSave && (

                className={`px-3 py-1.5 rounded-lg text-xs font-medium transition cursor-pointer ${

function App() {
  const [key, setKey] = useState(() => (typeof ytKeyManager !== 'undefined' ? ytKeyManager.getActiveKey() : (st.get('yt_key') || '')));
  const [showSubscriptionModal, setShowSubscriptionModal] = useState(false);
  const [subscriptionModalReason, setSubscriptionModalReason] = useState('manual');
  const [showAuthModal, setShowAuthModal] = useState(false);
  const [authNotice, setAuthNotice] = useState('');
  const [showSimpleApiKeyModal, setShowSimpleApiKeyModal] = useState(false);
  const [apiKeyNotice, setApiKeyNotice] = useState('');
  const [currentTier, setCurrentTier] = useState(() => (typeof ytTierManager !== 'undefined' ? ytTierManager.getTier() : 'FREE'));
  const [userProfile, setUserProfile] = useState(() => {
    try {
      return JSON.parse(st.get('yt_user_profile') || 'null') || { name: 'Người Dùng', isGoogleAuth: false };
    } catch(e) { return { name: 'Người Dùng', isGoogleAuth: false }; }
  });
  const [dailyUsage, setDailyUsage] = useState(() => (typeof ytTierManager !== 'undefined' ? ytTierManager.getUsage() : { keywords: [], analysisCount: 0 }));

  useEffect(() => {
    const handleKeySwitched = (e) => {
      const { newKey, candidateName } = e.detail || {};
      if (newKey) {
        setKey(newKey);
        if (typeof showToast === 'function') {
          showToast('Đã tự động xoay sang: ' + (candidateName || 'Key dự phòng') + ' (Do key trước hết Quota)');
        }
      }
    };
    const handleKeysUpdated = (e) => {
      const { activeKey } = e.detail || {};
      if (activeKey !== undefined) setKey(activeKey);
    };
    window.addEventListener('yt-key-switched', handleKeySwitched);
    window.addEventListener('yt-keys-updated', handleKeysUpdated);
    const handleTierChanged = (ev) => {
      const { tier: tName } = ev.detail || {};
      if (tName) setCurrentTier(tName);
    };
    const handleUsageUpdated = () => {
      if (typeof ytTierManager !== 'undefined') setDailyUsage(ytTierManager.getUsage());
    };
    window.addEventListener('yt-tier-changed', handleTierChanged);
    const handleProfileChanged = (e) => {
      const p = e.detail;
      if (p) setUserProfile(p);
    };
    window.addEventListener('yt-profile-changed', handleProfileChanged);
    window.addEventListener('yt-usage-updated', handleUsageUpdated);
    return () => {
      window.removeEventListener('yt-key-switched', handleKeySwitched);
      window.removeEventListener('yt-keys-updated', handleKeysUpdated);
      window.removeEventListener('yt-tier-changed', handleTierChanged);
      window.removeEventListener('yt-profile-changed', handleProfileChanged);
      window.removeEventListener('yt-usage-updated', handleUsageUpdated);
    };
  }, []);

        setShowF12Blocked(true);
        return false;
      }
      // Ctrl+Shift+I / J / C / K or Ctrl+U or Ctrl+S
      if (e.ctrlKey && ((e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c' || e.key === 'K' || e.key === 'k')) || e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) {

      // Mac Cmd+Option+I / J / C / K or Cmd+Option+U or Cmd+S

      if (reg === 'GLOBAL' || reg === 'all') {
        const [usRes, vnRes] = await Promise.allSettled([
          yt('videos', { part: 'snippet,statistics,topicDetails', chart: 'mostPopular', regionCode: 'US', maxResults: 35 }, key),
          yt('videos', { part: 'snippet,statistics,topicDetails', chart: 'mostPopular', regionCode: 'VN', maxResults: 35 }, key)
        ]);
        const usItems = usRes.status === 'fulfilled' && usRes.value?.items ? usRes.value.items : [];

        vids = [...usItems, ...vnItems];
      } else {
        const popularData = await yt('videos', {
          part: 'snippet,statistics,topicDetails',

          regionCode: reg,
          maxResults: 50

        vids = popularData.items || [];

      if (!vids.length) {
